<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

const STORAGE_KEY = 'xmasLightsTracker_v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

// Lights are logged once as a business expense, so the light cost per foot only shows on the
// Jobs tab ("with lights" figures). It never reaches the Dashboard, which would count it twice.
// inventoryAsOf: the date the stock was counted (the user's first count was 2026-10-28).
const DEFAULT_SETTINGS = { commissionPct: 20, cardFeePct: 3, lightCostPerFt: 1.5, miniLightCostPerBall: 12.5, bulbSpacingIn: 15, inventoryAsOf: '2026-10-28' };

// Labor under the retired hourly / per-foot pay model; only used to migrate old jobs.
function legacyLabor(job) {
  const feet = Number(job.feet) || 0;
  const assigns = job.assignments || [];
  const hourly = assigns.filter(a => a.payType === 'hourly')
    .reduce((s, a) => s + (Number(a.hours) || 0) * (Number(a.rate) || 0), 0);
  const pf = assigns.filter(a => a.payType === 'perfoot');
  if (!pf.length) return hourly;
  const rate = job.perFootRate != null
    ? Number(job.perFootRate)
    : pf.reduce((s, a) => s + (Number(a.rate) || 0), 0) / pf.length;
  return hourly + feet * (rate || 0);
}

// Pay used to be hourly or per-foot; it is now commission (% of job revenue). Completed jobs
// from the old pay model get the % that reproduces the labor they actually cost, so past
// profit doesn't shift. Every job then gets a % per tech (see perTechCommission).
function migrate(data) {
  const { perFootRate, materialCostPerFt, ...savedSettings } = data.settings || {};
  const settings = { ...DEFAULT_SETTINGS, ...savedSettings };
  // Carry over the old material rate if it's still in saved data from before it was removed.
  if (savedSettings.lightCostPerFt == null && materialCostPerFt != null) settings.lightCostPerFt = Number(materialCostPerFt);
  const techs = (data.techs || []).map(t => ({ id: t.id, name: t.name, ...(t.removed ? { removed: true } : {}) }));
  const jobs = (data.jobs || []).map(j => {
    const isLegacy = j.perFootRate != null || (j.assignments || []).some(a => a.payType);
    if (!isLegacy) return j;
    const { perFootRate: _oldRate, ...rest } = j;
    const migrated = { ...rest, assignments: (j.assignments || []).map(a => ({ techId: a.techId })) };
    if (j.status === 'Completed' && j.commissionPct == null) {
      const revenue = Number(j.revenue) || 0;
      migrated.commissionPct = revenue > 0 ? legacyLabor(j) / revenue * 100 : 0;
    }
    return migrated;
  }).map(j => perTechCommission(j, settings)).map(j => {
    if (!j.mockupId) return j;
    const { mockupId, ...rest } = j;
    return { ...rest, mockupIds: j.mockupIds || [mockupId] };
  });
  // Roofline used to be stocked as feet per color; it's now bulbs per color at the line spacing.
  let inventory = (Array.isArray(data.inventory) ? data.inventory : []).map(i => i.kind !== 'roofline' ? i
    : { ...i, kind: 'bulb', qty: socketsFor(Number(i.qty) || 0, settings) });
  // Timers got their own row (one per job). If they were typed into Other Supplies before
  // that, move that count over rather than tracking timers twice.
  if (!inventory.some(i => i.kind === 'timer')) {
    const typed = inventory.find(i => i.kind === 'other' && /^\s*timers?\s*$/i.test(i.name || ''));
    if (typed) inventory = inventory.map(i => i === typed ? { id: i.id, kind: 'timer', name: 'Timers', qty: Number(i.qty) || 0 } : i);
  }
  return { ...data, techs, jobs, settings, inventory };
}

// Commission used to be one % per job, split evenly between its techs; each tech now has
// their own % of the job's revenue (`assignment.pct`). Convert using the even split the
// job was already paying, so no job's commission or anyone's payout changes.
function perTechCommission(job, settings) {
  const assigns = job.assignments || [];
  if (job.commissionPct == null && !assigns.some(a => a.pct == null)) return job;
  const { commissionPct, ...rest } = job;
  const jobPct = Number(commissionPct != null ? commissionPct : settings.commissionPct) || 0;
  // Kept unrounded (e.g. exactly a third) so split payouts still add up to the cent.
  const share = assigns.length ? jobPct / assigns.length : 0;
  return { ...rest, assignments: assigns.map(a => ({ techId: a.techId, pct: a.pct != null ? Number(a.pct) || 0 : share })) };
}
// Percentages are stored unrounded; this is for display only.
const pct2 = (n) => Math.round((Number(n) || 0) * 100) / 100;

function loadData() {

// ---- Mock-up pictures ----
// A picture would quickly push the single synced data record past Firestore's ~1 MB limit and
// break syncing, so each one is shrunk and kept separately: in IndexedDB on the device, and in
// its own cloud record next to the main one. Jobs only store the pictures' ids (`mockupIds`).
// (An earlier version allowed one picture, saved as `mockupId`; migrate() converts it.)
const mockupIdsOf = (job) => job.mockupIds || (job.mockupId ? [job.mockupId] : []);
const mockupDoc = (uid, id) => FB_DB.collection('users').doc(uid).collection('data').doc('xmasMockup_' + id);
const IMG_DB_NAME = 'xmasLightsImages';
const IMG_STORE = 'mockups';
function imgDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IMG_DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IMG_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function imgTx(mode, fn) {
  const db = await imgDb();
  return new Promise((resolve, reject) => {
    const req = fn(db.transaction(IMG_STORE, mode).objectStore(IMG_STORE));
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
const imgGet = (id) => imgTx('readonly', s => s.get(id)).then(r => r || null);
const imgPut = (id, rec) => imgTx('readwrite', s => s.put(rec, id));
const imgDel = (id) => imgTx('readwrite', s => s.delete(id));
const imgKeys = () => imgTx('readonly', s => s.getAllKeys());

// Shrinks a picture to a JPEG small enough for one cloud record (~700 KB of text at most).
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('unreadable'));
      img.onload = () => {
        let maxSide = 1600, quality = 0.8, dataUrl = '';
        for (let i = 0; i < 8; i++) {
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';   // transparent areas would otherwise turn black in a JPEG
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          dataUrl = canvas.toDataURL('image/jpeg', quality);
          if (dataUrl.length <= 700000) break;
          maxSide = Math.round(maxSide * 0.8);
          quality = Math.max(0.5, quality - 0.08);
        }
        resolve(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Uploads any pictures saved on this device that haven't reached the cloud yet.
async function pushPendingMockups() {
  const user = FB_AUTH && FB_AUTH.currentUser;
  if (!user || !FB_DB) return;
  let ids = [];
  try { ids = await imgKeys(); } catch (e) { return; }
  for (const id of ids) {
    try {
      const rec = await imgGet(id);
      if (!rec || rec.uploaded) continue;
      await mockupDoc(user.uid, id).set({ dataUrl: rec.dataUrl, jobId: rec.jobId || '', updatedAt: Date.now() });
      await imgPut(id, { ...rec, uploaded: true });
    } catch (e) { console.warn('Mock-up upload failed; will retry', e); }
  }
}

// Returns the picture's data URL from this device, or fetches it from the cloud and keeps a copy.
async function loadMockup(id) {
  try { const rec = await imgGet(id); if (rec) return rec.dataUrl; } catch (e) {}
  const user = FB_AUTH && FB_AUTH.currentUser;
  if (!user || !FB_DB) return null;
  const snap = await mockupDoc(user.uid, id).get();
  if (!snap.exists) return null;
  const d = snap.data();
  try { await imgPut(id, { dataUrl: d.dataUrl, jobId: d.jobId, uploaded: true }); } catch (e) {}
  return d.dataUrl;
}

async function deleteMockup(id) {
  try { await imgDel(id); } catch (e) {}
  const user = FB_AUTH && FB_AUTH.currentUser;
  if (user && FB_DB) { try { await mockupDoc(user.uid, id).delete(); } catch (e) { console.warn('Mock-up delete failed', e); } }
}

// One rolling snapshot per day (last 14). A smaller snapshot never replaces a bigger one from the same day.
function autoBackup(data) {
  if (recordCount(data) === 0) return;
  const day = new Date().toDateString();
  const all = lsGet(BACKUP_KEY, []);
  const existing = all.find(b => b.day === day);
  if (existing && recordCount(existing.data) > recordCount(data)) return;
  const list = all.filter(b => b.day !== day);
  list.push({ day, ts: Date.now(), data });
  lsSet(BACKUP_KEY, list.slice(-14));
}

const EXPENSE_CATEGORIES = ['Vehicle & Fuel', 'Equipment & Supplies', 'Insurance', 'Advertising', 'Storage', 'Other'];

// ---- Core financial calculation for a single job ----
function computeJobFinancials(job, settings) {
  const revenue = Number(job.revenue) || 0;
  const misc = Number(job.miscCost) || 0;

  // Each tech on the job earns their own % of the job's revenue. A tech with no % yet (data
  // from an older version not converted) gets the even split of the job's old single %.
  const assigns = job.assignments || [];
  const techCount = assigns.length;
  const evenShare = techCount ? (Number(job.commissionPct != null ? job.commissionPct : settings.commissionPct) || 0) / techCount : 0;
  const shares = assigns.map(a => {
    const pct = a.pct != null ? Number(a.pct) || 0 : evenShare;
    return { techId: a.techId, pct, amount: revenue * pct / 100 };
  });
  const commissionPct = shares.reduce((s, x) => s + x.pct, 0);
  const commissionPool = shares.reduce((s, x) => s + x.amount, 0);

  const pay = jobPayments(job);
  const cardFees = cardFeeFor(job, 'deposit', pay.deposit, settings) + cardFeeFor(job, 'balance', pay.balance, settings);

  // Dashboard figures: no light cost, since lights are logged as a business expense.
  const laborCost = commissionPool;
  const totalCost = laborCost + misc + cardFees;
  const netProfit = revenue - totalCost;
  const margin = revenue > 0 ? netProfit / revenue : 0;

  // Jobs-tab figures: the same plus the lights this job used, to show its true profit.
  const feet = Number(job.feet) || 0;
  const lightCostPerFt = Number(settings.lightCostPerFt) || 0;
  const lightCost = feet * lightCostPerFt;
  const mini = miniLightTotals(job, settings);
  const costWithLights = totalCost + lightCost + mini.cost;
  const profitWithLights = revenue - costWithLights;
  const marginWithLights = revenue > 0 ? profitWithLights / revenue : 0;

  const payByTech = {};
  shares.forEach(s => { payByTech[s.techId] = (payByTech[s.techId] || 0) + s.amount; });

  return {
    commissionPct, commissionPool, shares, techCount, laborCost, cardFees,
    totalCost, netProfit, margin,
    feet, lightCostPerFt, lightCost, mini, costWithLights, profitWithLights, marginWithLights,
    payByTech,
  };
}

// Mini lights are listed per color with an estimated and an actual number of balls. A row's
// actual count is what's charged once it's entered; until then its estimate stands in.
// Like the roofline lights, this only feeds the Jobs-tab "with lights" figures.
const blankNum = (v) => v === '' || v == null;
function miniLightTotals(job, settings) {
  const pricePerBall = Number(settings.miniLightCostPerBall) || 0;
  let est = 0, actual = 0, charged = 0, usingEstimate = false;
  (job.miniLights || []).forEach(r => {
    const e = Number(r.est) || 0;
    est += e;
    if (blankNum(r.actual)) { charged += e; if (e) usingEstimate = true; }
    else { actual += Number(r.actual) || 0; charged += Number(r.actual) || 0; }
  });
  return { pricePerBall, est, actual, charged, usingEstimate, cost: charged * pricePerBall };
}
const MINI_LIGHT_COLORS = ['Warm White', 'Cool White', 'Multicolor', 'Red', 'Green', 'Blue', 'Purple', 'Orange', 'Pink'];

// ---- Inventory ----
// Roofline is stocked as line (feet, socketed every `bulbSpacingIn` inches) plus bulbs counted
// per base color. A job uses its feet of line, and one bulb per socket. Its roofline color is a
// pattern repeated along the line, so the bulbs are dealt out across the pattern's colors in order.
const ROOFLINE_BASE_COLORS = ['Warm White', 'Pure White', 'Red', 'Green', 'Multicolor'];
const ROOFLINE_PATTERNS = {
  'Warm White': ['Warm White'],
  'Candy Cane': ['Red', 'Pure White'],
  'Classic Christmas': ['Red', 'Green', 'Pure White'],
  'Multicolor': ['Multicolor'],
};
const spacingOf = (settings) => Number(settings.bulbSpacingIn) || 15;
// Sockets (= bulbs) on `feet` of line, rounded up so every socket gets a bulb.
const socketsFor = (feet, settings) => feet > 0 ? Math.ceil(feet * 12 / spacingOf(settings) - 1e-9) : 0;
// Bulbs per color for one run: the pattern repeats in order, so any leftover goes to its first colors.
function bulbsByColor(pattern, sockets) {
  const base = Math.floor(sockets / pattern.length);
  const extra = sockets % pattern.length;
  return pattern.map((color, i) => [color, base + (i < extra ? 1 : 0)]);
}
const ROOFLINE_PATTERN_HINTS = {
  'Warm White': 'warm white',
  'Candy Cane': 'red & pure white',
  'Classic Christmas': 'red, green & pure white',
  'Multicolor': 'multicolor',
};
// Inventory items: { id, kind: 'line' | 'bulb' | 'timer' | 'mini' | 'other', name, qty, note }.
// (A first version stocked roofline as feet per color, kind 'roofline'; migrate() converts it.)
const sameName = (a, b) => (a || '').trim().toLowerCase() === (b || '').trim().toLowerCase();

// What jobs need from the stock counted on `asOf`: every job scheduled on or after that date,
// done or not, since its lights come out of that stock and stay on the house. Jobs before it
// were already up when the stock was counted. Mini lights count the actual balls used, else the estimate.
function inventoryNeeds(jobs, asOf, settings) {
  const line = { needed: 0, uses: [] };   // feet of line, every job with roofline
  const timers = { needed: 0, uses: [] }; // one timer goes with every job
  const bulbs = {};      // base color -> { needed, uses: [{ job, amount }] }
  const mini = {};       // lowercased color -> { color, needed, uses }
  const noColor = { needed: 0, uses: [] };  // feet whose bulb colors aren't picked yet
  const add = (bucket, job, amount) => {
    bucket.needed += amount;
    const same = bucket.uses.find(u => u.job.id === job.id);
    if (same) same.amount += amount; else bucket.uses.push({ job, amount });
  };
  jobs.forEach(job => {
    const day = scheduledOf(job);
    if (!day || day < asOf) return;
    add(timers, job, 1);
    const feet = Number(job.feet) || 0;
    if (feet > 0) {
      add(line, job, feet);
      const pattern = ROOFLINE_PATTERNS[job.rooflineColor];
      if (!pattern) add(noColor, job, feet);
      else bulbsByColor(pattern, socketsFor(feet, settings)).forEach(([color, count]) => {
        if (count) add(bulbs[color] || (bulbs[color] = { needed: 0, uses: [] }), job, count);
      });
    }
    (job.miniLights || []).forEach(r => {
      const balls = blankNum(r.actual) ? (Number(r.est) || 0) : (Number(r.actual) || 0);
      if (!balls) return;
      const color = (r.color || '').trim() || 'No color picked';
      const key = color.toLowerCase();
      add(mini[key] || (mini[key] = { color, needed: 0, uses: [] }), job, balls);
    });
  });
  return { line, bulbs, timers, mini, noColor };
}

// ---- Deposit / balance tracking (deposit is half the job revenue) ----
function jobPayments(job) {
  const revenue = Number(job.revenue) || 0;
  const deposit = revenue * 0.5;
  const balance = revenue - deposit;
  const collected = (job.depositPaid ? deposit : 0) + (job.balancePaid ? balance : 0);
  return { revenue, deposit, balance, collected, outstanding: revenue - collected, fullyPaid: revenue > 0 && !!job.depositPaid && !!job.balancePaid };
}

const PAY_METHODS = ['Cash', 'Check', 'Card', 'Zelle/Venmo', 'Other'];

// The fee % is locked in when a payment is recorded as Card, so changing the fee
// setting later doesn't rewrite fees on payments already taken.
const feePctFor = (job, which, settings) =>
  Number(job[which + 'FeePct'] != null ? job[which + 'FeePct'] : settings.cardFeePct) || 0;
function cardFeeFor(job, which, amount, settings) {
  if (!job[which + 'Paid'] || job[which + 'Method'] !== 'Card') return 0;
  return amount * feePctFor(job, which, settings) / 100;
}

// Payment fields to store for a deposit or balance ('deposit' | 'balance'). Clears the
// method and fee lock when unpaid; keeps an existing Card fee lock if it stays Card.
function paymentFields(job, which, paid, method, settings) {
  const out = { [which + 'Paid']: paid };
  if (paid && method) out[which + 'Method'] = method;
  if (paid && method === 'Card') {
    const keep = job[which + 'Method'] === 'Card' && job[which + 'FeePct'] != null;
    out[which + 'FeePct'] = keep ? job[which + 'FeePct'] : Number(settings.cardFeePct) || 0;
  }
  return out;
}
const withoutPayment = (job, which) => {
  const { [which + 'Paid']: _p, [which + 'Method']: _m, [which + 'FeePct']: _f, ...rest } = job;
  return rest;
};

// The dashboard only counts money that's actually in: completed jobs paid in full.
const isRealized = (job) => job.status === 'Completed' && jobPayments(job).fullyPaid;
// Jobs saved before scheduling existed fall back to the date they were created.
const scheduledOf = (job) => job.scheduledDate || (job.date ? job.date.slice(0, 10) : '');

// Commission owed per pay week: completed jobs, grouped by the week of their scheduled
// (install) date. Newest week first.
function weeklyPayouts(jobs, settings) {
  const weeks = {};
  jobs.forEach(job => {
    const day = scheduledOf(job);
    if (job.status !== 'Completed' || !day) return;
    const calc = computeJobFinancials(job, settings);
    if (!calc.techCount) return;
    const monday = weekStartOf(day);
    const key = ymdOf(monday);
    const week = weeks[key] || (weeks[key] = { key, monday, total: 0, byTech: {}, jobs: [] });
    week.jobs.push({ job, calc, owed: jobPayments(job).outstanding });
    Object.entries(calc.payByTech).forEach(([techId, amount]) => {
      const t = week.byTech[techId] || (week.byTech[techId] = { techId, amount: 0, jobCount: 0 });
      t.amount += amount;
      t.jobCount += 1;
      week.total += amount;
    });
  });
  Object.values(weeks).forEach(w => w.jobs.sort((a, b) => scheduledOf(a.job).localeCompare(scheduledOf(b.job))));
  return Object.values(weeks).sort((a, b) => b.key.localeCompare(a.key));
}

// ================= App =================
function App() {
  const initial = useMemo(loadData, []);
  const [techs, setTechs] = useState(initial.techs);
  const [jobs, setJobs] = useState(initial.jobs);
  const [expenses, setExpenses] = useState(initial.expenses);
  const [inventory, setInventory] = useState(initial.inventory);
  const [settings, setSettings] = useState(initial.settings);
  const [tab, setTab] = useState('jobs');

  const [techModal, setTechModal] = useState(null); // null | {} | tech
  const [jobModal, setJobModal] = useState(null); // null | {} | job
  const [expenseModal, setExpenseModal] = useState(null); // null | {} | expense

  // ---- Auth + sync ----
  const [user, setUser] = useState(null);
  const [syncState, setSyncState] = useState('synced'); // synced | saving | error
  const [authError, setAuthError] = useState('');
  const userRef = useRef(null);
  const dataRef = useRef(null);
  const snapshotUnsub = useRef(null);
  const lastCloudJSON = useRef('');
  const cloudReady = useRef(false);
  const isSaving = useRef(false);
  const retryTimer = useRef(null);
  const firstRun = useRef(true);
  const localUpdatedAt = useRef(Number(lsGet(TS_KEY, 0)) || 0);
  userRef.current = user;
  dataRef.current = { techs, jobs, expenses, settings, inventory };

  const doCloudSave = (uid, contentJson, ts) => {
    clearTimeout(retryTimer.current);
    isSaving.current = true;
    localUpdatedAt.current = ts;
    lsSet(TS_KEY, ts);
    setSyncState('saving');
    try {
      userDoc(uid).set({ ...JSON.parse(contentJson), updatedAt: ts })
        .then(() => { lastCloudJSON.current = contentJson; isSaving.current = false; setSyncState('synced'); })
        .catch((err) => {
          console.warn('Cloud save failed', err);
          isSaving.current = false;
          setSyncState('error');
          retryTimer.current = setTimeout(() => doCloudSave(uid, contentJson, ts), 8000);
        });
    } catch (e) { isSaving.current = false; setSyncState('error'); }
  };

  const subscribeToCloud = (uid) => {
    if (snapshotUnsub.current) { snapshotUnsub.current(); snapshotUnsub.current = null; }
    snapshotUnsub.current = userDoc(uid).onSnapshot(snapshot => {
      cloudReady.current = true;
      const local = dataRef.current;
      if (snapshot.exists) {
        const d = snapshot.data();
        // Another device may still be running an older version, so convert whatever arrives.
        const incoming = migrate({
          techs: d.techs || [],
          jobs: d.jobs || [],
          expenses: d.expenses || [],
          settings: d.settings || {},
          inventory: d.inventory,
        });
        // A copy saved by a version from before the Inventory tab has no `inventory` field at
        // all. Adopting it must not wipe this device's inventory: keep ours, and the save that
        // follows puts it back in the cloud.
        const cloudKnowsInventory = Array.isArray(d.inventory);
        const incomingJSON = JSON.stringify(incoming);
        if (incomingJSON === lastCloudJSON.current) return;

        // Only adopt the cloud copy if it is genuinely newer; a stale/emptier copy must never
        // overwrite newer local data. In that case keep ours and re-push it to heal the cloud.
        // A completely empty cloud copy is never trusted over real local data, whatever its timestamp.
        const cloudTs = Number(d.updatedAt) || 0;
        const localTs = Number(localUpdatedAt.current) || 0;
        const cloudCount = recordCount(incoming);
        const localCount = recordCount(local);
        if (cloudCount === 0 && localCount === 0) return;
        const adopt = cloudCount > 0 && (
          localCount === 0
          || cloudTs > localTs
          || (cloudTs === localTs && cloudCount >= localCount));

        if (adopt) {
          lastCloudJSON.current = incomingJSON;
          localUpdatedAt.current = cloudTs;
          lsSet(TS_KEY, cloudTs);
          setTechs(incoming.techs);
          setJobs(incoming.jobs);
          setExpenses(incoming.expenses);
          setSettings(incoming.settings);
          setInventory(cloudKnowsInventory ? incoming.inventory : local.inventory);
        } else if (!isSaving.current) {
          doCloudSave(uid, JSON.stringify(local), Math.max(localTs, cloudTs) + 1);
        }
      } else if (recordCount(local) > 0) {
        // No cloud copy yet: seed it, but never from an empty device.
        const ts = Math.max(Number(localUpdatedAt.current) || 0, Date.now());
        doCloudSave(uid, JSON.stringify(local), ts);
      }
    }, (err) => {
      console.warn('Cloud listen failed', err);
      setSyncState('error');
      if (err && err.code === 'permission-denied') setAuthError('Cloud sync was denied by Firestore security rules.');
    });
  };

  useEffect(() => {
    if (!FB_AUTH) return;
    const unsub = FB_AUTH.onAuthStateChanged(u => {
      setUser(u);
      if (u) { subscribeToCloud(u.uid); pushPendingMockups(); }
      else if (snapshotUnsub.current) { snapshotUnsub.current(); snapshotUnsub.current = null; cloudReady.current = false; }
    });
    return () => { unsub(); if (snapshotUnsub.current) snapshotUnsub.current(); };
  }, []);

  // Runs only when the data itself changes (not on sign-in), so a stale device is never
  // mistaken for the newest copy just because someone signed in on it.
  useEffect(() => {
    const data = { techs, jobs, expenses, settings, inventory };
    saveData(data);
    const json = JSON.stringify(data);
    if (json === lastCloudJSON.current) return;
    autoBackup(data);
    if (firstRun.current) { firstRun.current = false; return; }
    const ts = Date.now();
    if (!userRef.current || !cloudReady.current) {
      localUpdatedAt.current = ts;
      lsSet(TS_KEY, ts);
      return;
    }
    doCloudSave(userRef.current.uid, json, ts);
  }, [techs, jobs, expenses, settings, inventory]);

  const signIn = () => {
    setAuthError('');
    if (!FB_AUTH) { setAuthError('Sync is unavailable right now (could not load Google sign-in). Check your connection.'); return; }
    FB_AUTH.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => {
      setAuthError(err && err.code === 'auth/unauthorized-domain'
        ? 'This web address is not authorized for Google sign-in yet.'
        : 'Sign-in failed: ' + ((err && err.message) || 'unknown error'));
    });
  };
  const signOut = () => {
    FB_AUTH.signOut();
    cloudReady.current = false;
    clearTimeout(retryTimer.current);
    if (snapshotUnsub.current) { snapshotUnsub.current(); snapshotUnsub.current = null; }
  };

  const importData = (raw) => {
    const d = migrate({
      techs: Array.isArray(raw.techs) ? raw.techs : [],
      jobs: Array.isArray(raw.jobs) ? raw.jobs : [],
      expenses: Array.isArray(raw.expenses) ? raw.expenses : [],
      settings: raw.settings || {},
      inventory: raw.inventory,
    });
    setTechs(d.techs);
    setJobs(d.jobs);
    setExpenses(d.expenses);
    setSettings(d.settings);
    // A backup from before the Inventory tab has no inventory; keep the current one then.
    if (Array.isArray(raw.inventory)) setInventory(d.inventory);
  };

  const upsertTech = (t) => {
    setTechs(prev => {
      const exists = prev.some(x => x.id === t.id);
      return exists ? prev.map(x => x.id === t.id ? t : x) : [...prev, t];
    });
  };
  // Removing a tech only takes them off jobs that aren't completed. Completed jobs keep them,
  // so past payouts and everyone else's share of those jobs never change. A tech with
  // completed work stays on record (hidden from the roster) so their name still shows.
  const deleteTech = (id) => {
    const hasHistory = jobs.some(j => j.status === 'Completed' && (j.assignments || []).some(a => a.techId === id));
    setTechs(prev => hasHistory ? prev.map(t => t.id === id ? { ...t, removed: true } : t) : prev.filter(t => t.id !== id));
    setJobs(prev => prev.map(j => j.status === 'Completed' ? j
      : { ...j, assignments: (j.assignments || []).filter(a => a.techId !== id) }));
  };
  const activeTechs = techs.filter(t => !t.removed);

  const upsertJob = (j) => {
    setJobs(prev => {
      const exists = prev.some(x => x.id === j.id);
      return exists ? prev.map(x => x.id === j.id ? j : x) : [j, ...prev];
    });
  };
  const deleteJob = (id) => {
    const job = jobs.find(j => j.id === id);
    if (job) mockupIdsOf(job).forEach(deleteMockup);
    setJobs(prev => prev.filter(j => j.id !== id));
  };
  const setPayment = (id, which, paid, method) => setJobs(prev => prev.map(j => j.id !== id ? j
    : { ...withoutPayment(j, which), ...paymentFields(j, which, paid, method, settings) }));

  const upsertExpense = (ex) => {
    setExpenses(prev => {
      const exists = prev.some(x => x.id === ex.id);
      return exists ? prev.map(x => x.id === ex.id ? ex : x) : [ex, ...prev];
    });
  };
  const deleteExpense = (id) => setExpenses(prev => prev.filter(e => e.id !== id));

  return (
    <React.Fragment>
      <header className="app-header">
        <div className="header-inner">
          <span className="emoji">🎄</span>
          <h1>Christmas Lights</h1>
          <button className={"sync-pill" + (user && syncState === 'synced' ? ' ok' : '') + (syncState === 'error' ? ' err' : '')}
            onClick={() => setTab('settings')}>
            {!user ? '☁️ Sign in to sync' : syncState === 'saving' ? '☁️ Saving…' : syncState === 'error' ? '⚠️ Sync error' : '✓ Synced'}
          </button>
        </div>
      </header>
      <main>
        {tab === 'jobs' && (
          <JobsTab jobs={jobs} techs={techs} settings={settings}
            onAdd={() => setJobModal({})}
            onEdit={(j) => setJobModal(j)}
            onDelete={deleteJob} onSetPayment={setPayment} />
        )}
        {tab === 'inventory' && (
          <InventoryTab jobs={jobs} inventory={inventory} setInventory={setInventory} settings={settings} setSettings={setSettings} onEditJob={(j) => setJobModal(j)} />
        )}
        {tab === 'techs' && (
          <TechsTab techs={activeTechs} allTechs={techs} jobs={jobs} settings={settings}
            onAdd={() => setTechModal({})}
            onEdit={(t) => setTechModal(t)}
            onDelete={deleteTech} />
        )}
        {tab === 'expenses' && (
          <ExpensesTab expenses={expenses}
            onAdd={() => setExpenseModal({})}
            onEdit={(e) => setExpenseModal(e)}
            onDelete={deleteExpense} />
        )}
        {tab === 'dashboard' && (
          <DashboardTab jobs={jobs} techs={techs} expenses={expenses} settings={settings} />
        )}
        {tab === 'settings' && (
          <SettingsTab settings={settings} setSettings={setSettings}
            techs={activeTechs} onAddTech={() => setTechModal({})}
            onEditTech={(t) => setTechModal(t)} onDeleteTech={deleteTech}
            jobs={jobs} onEditJob={(j) => setJobModal(j)} onDeleteJob={deleteJob}
            expenses={expenses} onEditExpense={(e) => setExpenseModal(e)} onDeleteExpense={deleteExpense}
            inventory={inventory}
            user={user} syncState={syncState} authError={authError} signIn={signIn} signOut={signOut} onImport={importData} />
        )}
      </main>

      {tab === 'jobs' && (
        <div className="fab-wrap"><button className="fab" onClick={() => setJobModal({})} aria-label="Add job">+</button></div>
      )}
      {tab === 'techs' && (
        <div className="fab-wrap"><button className="fab" onClick={() => setTechModal({})} aria-label="Add tech">+</button></div>
      )}
      {tab === 'expenses' && (
        <div className="fab-wrap"><button className="fab" onClick={() => setExpenseModal({})} aria-label="Add expense">+</button></div>
      )}

      <nav className="tab-bar">
        <button className={"tab-btn" + (tab === 'jobs' ? ' active' : '')} onClick={() => setTab('jobs')}>
          <span className="ic">🧾</span>Jobs
        </button>
        <button className={"tab-btn" + (tab === 'inventory' ? ' active' : '')} onClick={() => setTab('inventory')}>
          <span className="ic">📦</span>Inventory
        </button>
        <button className={"tab-btn" + (tab === 'techs' ? ' active' : '')} onClick={() => setTab('techs')}>
          <span className="ic">👷</span>Techs
        </button>
        <button className={"tab-btn" + (tab === 'expenses' ? ' active' : '')} onClick={() => setTab('expenses')}>
          <span className="ic">💸</span>Expenses
        </button>
        <button className={"tab-btn" + (tab === 'dashboard' ? ' active' : '')} onClick={() => setTab('dashboard')}>
          <span className="ic">📊</span>Dashboard
        </button>
        <button className={"tab-btn" + (tab === 'settings' ? ' active' : '')} onClick={() => setTab('settings')}>
          <span className="ic">⚙️</span>Settings
        </button>
      </nav>

      {techModal && (
        <TechModal tech={techModal} onClose={() => setTechModal(null)}
          onSave={(t) => { upsertTech(t); setTechModal(null); }} />
      )}
      {jobModal && (
        <JobModal job={jobModal} techs={techs} settings={settings} inventory={inventory}
          onClose={() => setJobModal(null)}
          onSave={(j) => { upsertJob(j); setJobModal(null); }} />
      )}
      {expenseModal && (
        <ExpenseModal expense={expenseModal} onClose={() => setExpenseModal(null)}
          onSave={(e) => { upsertExpense(e); setExpenseModal(null); }} />
      )}
    </React.Fragment>
  );
}

// A text box that only saves when you leave it (or press Enter), so typing doesn't sync
// every keystroke. onCommit returns false to reject the value and restore the old one.
function CommitInput({ value, onCommit, ...props }) {
  const shown = value == null ? '' : String(value);
  const [text, setText] = useState(shown);
  useEffect(() => { setText(shown); }, [shown]);
  const commit = () => { if (text !== shown && onCommit(text) === false) setText(shown); };
  // Also save if the box disappears while still holding an unsaved edit (e.g. switching tabs).
  const latest = useRef(null);
  latest.current = { text, shown, onCommit };
  useEffect(() => () => {
    const l = latest.current;
    if (l.text !== l.shown) l.onCommit(l.text);
  }, []);
  return <input {...props} value={text} onChange={e => setText(e.target.value)} onBlur={commit}
    onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }} />;
}

const validQty = (text) => text.trim() !== '' && !isNaN(Number(text)) && Number(text) >= 0;
const fmtQty = (n) => Math.round(n).toLocaleString();

function InventoryTab({ jobs, inventory, setInventory, settings, setSettings, onEditJob }) {
  const asOf = settings.inventoryAsOf || DEFAULT_SETTINGS.inventoryAsOf;
  const needs = useMemo(() => inventoryNeeds(jobs, asOf, settings), [jobs, asOf, settings.bulbSpacingIn]);
  const spacing = spacingOf(settings);
  const [open, setOpen] = useState(null); // "kind:color" row showing its jobs

  const itemsOf = (kind) => inventory.filter(i => i.kind === kind);
  const setQty = (kind, name, text) => {
    if (!validQty(text)) { alert('Enter a number of 0 or more.'); return false; }
    const qty = Number(text);
    setInventory(prev => prev.some(i => i.kind === kind && sameName(i.name, name))
      ? prev.map(i => i.kind === kind && sameName(i.name, name) ? { ...i, qty } : i)
      : [...prev, { id: uid(), kind, name, qty }]);
  };
  const updateItem = (id, patch) => setInventory(prev => prev.map(i => i.id === id ? { ...i, ...patch } : i));
  const removeItem = (id) => setInventory(prev => prev.filter(i => i.id !== id));
  const addItem = (kind) => setInventory(prev => [...prev, { id: uid(), kind, name: '', qty: 0 }]);

  // Need rounds up: a job can't use a fraction of a foot of line.
  const need = (bucket) => bucket ? Math.ceil(bucket.needed - 1e-6) : 0;
  const timerItem = itemsOf('timer')[0];
  const timerRow = { key: 'timer', kind: 'timer', name: 'Timers', have: timerItem ? Number(timerItem.qty) || 0 : 0, need: need(needs.timers), uses: needs.timers.uses };
  const lineItem = itemsOf('line')[0];
  const lineRow = { key: 'line', kind: 'line', name: 'Line', have: lineItem ? Number(lineItem.qty) || 0 : 0, need: need(needs.line), uses: needs.line.uses };
  const bulbRows = ROOFLINE_BASE_COLORS.map(color => {
    const item = itemsOf('bulb').find(i => sameName(i.name, color));
    const bucket = needs.bulbs[color];
    return { key: 'bulb:' + color, kind: 'bulb', name: color, have: item ? Number(item.qty) || 0 : 0, need: need(bucket), uses: bucket ? bucket.uses : [] };
  });
  const miniItems = itemsOf('mini');
  const miniRows = [
    ...miniItems.map(item => {
      const bucket = item.name.trim() ? needs.mini[item.name.trim().toLowerCase()] : null;
      return { key: 'mini:' + item.id, kind: 'mini', item, name: item.name, have: Number(item.qty) || 0, need: need(bucket), uses: bucket ? bucket.uses : [] };
    }),
    // Colors on jobs that aren't in the inventory yet.
    ...Object.values(needs.mini)
      .filter(b => !miniItems.some(i => sameName(i.name, b.color)))
      .sort((a, b) => a.color.localeCompare(b.color))
      .map(b => ({ key: 'mini:job:' + b.color.toLowerCase(), kind: 'mini', item: null, name: b.color, have: 0, need: need(b), uses: b.uses })),
  ];
  const shortages = [
    ...(lineRow.need > lineRow.have ? [{ name: `${spacing}″ line`, amount: lineRow.need - lineRow.have, unit: 'ft', what: 'roofline' }] : []),
    ...bulbRows.filter(r => r.need > r.have).map(r => ({ name: r.name, amount: r.need - r.have, unit: 'bulbs', what: 'roofline bulbs' })),
    ...(timerRow.need > timerRow.have ? [{ name: 'Timers', amount: timerRow.need - timerRow.have, unit: '', what: 'one per job' }] : []),
    ...miniRows.filter(r => r.need > r.have).map(r => ({ name: r.name, amount: r.need - r.have, unit: 'balls', what: 'mini lights' })),
  ];

  const usesList = (row, unit) => open === row.key && (
    <div className="inv-uses">
      {row.uses.length === 0 ? <div>No jobs since your stock count use this.</div> : row.uses.map(({ job, amount }) => (
        <div key={job.id} className="inv-use" onClick={() => onEditJob(job)}>
          <span><b>{job.customer}</b> · {fmtDateOnly(scheduledOf(job))} · {job.status}</span>
          <span>{fmtQty(amount)} {unit}</span>
        </div>
      ))}
    </div>
  );
  const leftCell = (row) => {
    const left = row.have - row.need;
    return <span className={'inv-left ' + (left < 0 ? 'short' : 'ok')}>{left < 0 ? `${fmtQty(-left)} short` : fmtQty(left)}</span>;
  };

  return (
    <div>
      <div className="card" style={shortages.length ? { borderColor: 'var(--loss)' } : {}}>
        <div className="section-title">{shortages.length ? 'Need to Order' : 'Stock Check'}</div>
        {shortages.length === 0 ? (
          <div className="hint" style={{ marginTop: 0 }}>✓ You have enough line, bulbs, timers and mini lights for every job since your stock count.</div>
        ) : shortages.map(s => (
          <div className="payout-row" key={s.what + s.name}>
            <span><b>{s.name}</b> <span className="tech-meta">{s.what}</span></span>
            <span style={{ fontWeight: 800, color: 'var(--loss)' }}>{fmtQty(s.amount)} {s.unit}</span>
          </div>
        ))}
        <label style={{ marginTop: 12 }}>Stock counted on</label>
        <input type="date" value={asOf} style={{ maxWidth: 200 }} aria-label="Date the stock was counted"
          onChange={e => { if (e.target.value) setSettings(s => ({ ...s, inventoryAsOf: e.target.value })); }} />
        <div className="hint">
          Counting jobs scheduled on or after {fmtDateOnly(asOf)}, done or not, since their lights come out of this stock.
          Jobs before then were already up when you counted. When you recount (like next season), change this date.
        </div>
      </div>

      {needs.noColor.needed > 0 && (
        <div className="card" style={{ borderColor: 'var(--gold)' }}>
          <div className="hint" style={{ marginTop: 0, color: 'var(--text)' }}>
            ⚠ <b>{fmtQty(needs.noColor.needed)} ft</b> of roofline is on jobs with no color picked. The line is counted, but its bulbs aren’t counted against any color yet. Tap a job to pick one:
          </div>
          {needs.noColor.uses.map(({ job, amount }) => (
            <div key={job.id} className="inv-use" onClick={() => onEditJob(job)}>
              <span><b>{job.customer}</b> · {fmtDateOnly(scheduledOf(job))}</span><span>{fmtQty(amount)} ft</span>
            </div>
          ))}
        </div>
      )}

      <div className="card">
        <div className="section-title">Roofline Line (feet)</div>
        <div className="inv-grid inv-head"><span></span><span>Have</span><span>On jobs</span><span>Left</span></div>
        <div className="inv-grid">
          <span className="inv-name" onClick={() => setOpen(open === 'line' ? null : 'line')}>{spacing}″ spaced line <span className="tech-meta">{open === 'line' ? '▾' : '▸'}</span></span>
          <CommitInput type="number" inputMode="numeric" min="0" step="1" value={lineRow.have} aria-label="Feet of line on hand"
            onCommit={text => setQty('line', 'Line', text)} />
          <span className="inv-num">{fmtQty(lineRow.need)}</span>
          {leftCell(lineRow)}
        </div>
        {usesList(lineRow, 'ft')}
      </div>

      <div className="card">
        <div className="section-title">Roofline Bulbs</div>
        <div className="inv-grid inv-head"><span>Color</span><span>Have</span><span>On jobs</span><span>Left</span></div>
        {bulbRows.map(row => (
          <React.Fragment key={row.key}>
            <div className="inv-grid">
              <span className="inv-name" onClick={() => setOpen(open === row.key ? null : row.key)}>{row.name} <span className="tech-meta">{open === row.key ? '▾' : '▸'}</span></span>
              <CommitInput type="number" inputMode="numeric" min="0" step="1" value={row.have} aria-label={`${row.name} bulbs on hand`}
                onCommit={text => setQty('bulb', row.name, text)} />
              <span className="inv-num">{fmtQty(row.need)}</span>
              {leftCell(row)}
            </div>
            {usesList(row, 'bulbs')}
          </React.Fragment>
        ))}
        <div className="hint">
          Your line has a bulb every {spacing}″, so each foot takes {pct2(12 / spacing)} bulbs ({fmtQty(socketsFor(100, settings))} bulbs per 100 ft).
          Candy Cane alternates Red and Pure White; Classic Christmas repeats Red, Green, Pure White. Tap a color to see the jobs using it.
        </div>
      </div>

      <div className="card">
        <div className="section-title">Timers</div>
        <div className="inv-grid inv-head"><span></span><span>Have</span><span>On jobs</span><span>Left</span></div>
        <div className="inv-grid">
          <span className="inv-name" onClick={() => setOpen(open === 'timer' ? null : 'timer')}>Timers <span className="tech-meta">{open === 'timer' ? '▾' : '▸'}</span></span>
          <CommitInput type="number" inputMode="numeric" min="0" step="1" value={timerRow.have} aria-label="Timers on hand"
            onCommit={text => setQty('timer', 'Timers', text)} />
          <span className="inv-num">{fmtQty(timerRow.need)}</span>
          {leftCell(timerRow)}
        </div>
        {usesList(timerRow, 'timer')}
        <div className="hint">Every job gets one timer, so this counts one for each job since your stock count.</div>
      </div>

      <div className="card">
        <div className="section-title">Mini Lights (balls)</div>
        {miniRows.length === 0 ? (
          <div className="hint" style={{ marginTop: 0 }}>No mini lights yet. Add the colors you have in stock.</div>
        ) : (
          <div className="inv-grid inv-head"><span>Color</span><span>Have</span><span>On jobs</span><span>Left</span></div>
        )}
        {miniRows.map(row => (
          <React.Fragment key={row.key}>
            <div className="inv-grid">
              {row.item ? (
                <span className="inv-name-edit">
                  <CommitInput type="text" list="inv-mini-colors" value={row.item.name} placeholder="Color" aria-label="Mini light color"
                    onCommit={text => {
                      if (miniItems.some(i => i.id !== row.item.id && sameName(i.name, text))) { alert('That color is already in your inventory.'); return false; }
                      updateItem(row.item.id, { name: text.trim() });
                    }} />
                  <button className="icon-btn" onClick={() => setOpen(open === row.key ? null : row.key)} aria-label="Show jobs">{open === row.key ? '▾' : '▸'}</button>
                </span>
              ) : (
                <span className="inv-name" onClick={() => setOpen(open === row.key ? null : row.key)}>{row.name} <span className="tech-meta">{open === row.key ? '▾' : '▸'} on jobs, not in stock</span></span>
              )}
              <CommitInput type="number" inputMode="numeric" min="0" step="1" value={row.have} aria-label={`${row.name || 'Mini light'} balls on hand`}
                onCommit={text => row.item ? (validQty(text) ? updateItem(row.item.id, { qty: Number(text) }) : (alert('Enter a number of 0 or more.'), false)) : setQty('mini', row.name, text)} />
              <span className="inv-num">{fmtQty(row.need)}</span>
              {leftCell(row)}
            </div>
            {usesList(row, 'balls')}
            {row.item && open === row.key && (
              <button className="btn btn-ghost btn-sm" style={{ color: 'var(--loss)', marginBottom: 8 }}
                onClick={() => { if (confirm(`Remove ${row.name || 'this color'} from inventory?`)) removeItem(row.item.id); }}>Remove from inventory</button>
            )}
          </React.Fragment>
        ))}
        <datalist id="inv-mini-colors">{MINI_LIGHT_COLORS.map(c => <option key={c} value={c} />)}</datalist>
        <button className="btn btn-ghost btn-sm" style={{ marginTop: 8 }} onClick={() => addItem('mini')}>+ Add color</button>
        <div className="hint">Matched to jobs by color name. Jobs count the actual balls used once entered, otherwise the estimate.</div>
      </div>

      <div className="card">
        <div className="section-title">Other Supplies</div>
        {itemsOf('other').length === 0 && <div className="hint" style={{ marginTop: 0 }}>Clips, timers, extension cords, stakes… whatever else you keep on hand.</div>}
        {itemsOf('other').length > 0 && <div className="other-grid inv-head"><span>Item</span><span>Qty</span><span>Note</span><span></span></div>}
        {itemsOf('other').map(item => (
          <div className="other-grid" key={item.id}>
            <CommitInput type="text" value={item.name} placeholder="Item" aria-label="Supply name" onCommit={text => updateItem(item.id, { name: text.trim() })} />
            <CommitInput type="number" inputMode="numeric" min="0" step="1" value={item.qty} aria-label="Quantity"
              onCommit={text => validQty(text) ? updateItem(item.id, { qty: Number(text) }) : (alert('Enter a number of 0 or more.'), false)} />
            <CommitInput type="text" value={item.note || ''} placeholder="e.g. boxes of 100" aria-label="Note" onCommit={text => updateItem(item.id, { note: text.trim() })} />
            <button className="icon-btn danger" onClick={() => { if (confirm(`Remove ${item.name || 'this item'}?`)) removeItem(item.id); }} aria-label="Remove item">✕</button>
          </div>
        ))}
        <button className="btn btn-ghost btn-sm" style={{ marginTop: 8 }} onClick={() => addItem('other')}>+ Add item</button>
      </div>
    </div>
  );
}

// ================= Techs =================
function WeeklyPayouts({ jobs, allTechs, settings }) {
  const weeks = useMemo(() => weeklyPayouts(jobs, settings), [jobs, settings]);
  const [openWeeks, setOpenWeeks] = useState({});
  const thisWeek = ymdOf(weekStartOf(todayYMD()));
  const nameOf = (id) => (allTechs.find(t => t.id === id) || {}).name || 'Former tech';
  const toggle = (key) => setOpenWeeks(o => ({ ...o, [key]: !o[key] }));

  return (
    <div>
      <div className="section-title" style={{ marginTop: 6 }}>Weekly Payouts</div>
      <div className="hint" style={{ marginBottom: 10 }}>
        Commission owed from completed jobs, grouped by the week of each job's scheduled date (Monday–Sunday).
      </div>
      {weeks.length === 0 ? (
        <div className="card"><div className="empty-state">
          <div className="big">💵</div>
          No payouts yet. Commission shows up here once a job with techs on it is marked Completed.
        </div></div>
      ) : weeks.map(w => {
        const owedJobs = w.jobs.filter(j => j.owed > 0).length;
        return (
          <div className="card" key={w.key}>
            <div className="row" style={{ marginBottom: 4 }}>
              <div>
                <div className="tech-name">{w.key === thisWeek ? 'This week' : 'Week of ' + w.monday.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>
                <div className="tech-meta">{fmtWeekRange(w.monday)}</div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontWeight: 800, fontSize: 17 }}>{fmtMoney2(w.total)}</div>
                <div className="tech-meta">total payout</div>
              </div>
            </div>
            {Object.values(w.byTech).sort((a, b) => b.amount - a.amount).map(t => (
              <div className="payout-row" key={t.techId}>
                <span><b>{nameOf(t.techId)}</b> <span className="tech-meta">· {t.jobCount} {t.jobCount === 1 ? 'job' : 'jobs'}</span></span>
                <span style={{ fontWeight: 800, color: 'var(--profit)' }}>{fmtMoney2(t.amount)}</span>
              </div>
            ))}
            {owedJobs > 0 && (
              <div className="hint" style={{ color: 'var(--loss)', marginTop: 6 }}>
                ⚠ {owedJobs} {owedJobs === 1 ? 'job this week still has' : 'jobs this week still have'} money owed by the customer.
              </div>
            )}
            <button className="btn btn-ghost btn-sm" style={{ marginTop: 10 }} onClick={() => toggle(w.key)}>
              {openWeeks[w.key] ? 'Hide jobs' : `Show ${w.jobs.length} ${w.jobs.length === 1 ? 'job' : 'jobs'}`}
            </button>
            {openWeeks[w.key] && (
              <div style={{ marginTop: 8 }}>
                {w.jobs.map(({ job, calc, owed }) => (
                  <div className="payout-job" key={job.id}>
                    <b>{job.customer}</b> · {fmtDateOnly(scheduledOf(job))}
                    {owed > 0 && <span className="badge badge-owed" style={{ marginLeft: 6 }}>Customer owes {fmtMoney(owed)}</span>}
                    <div>{fmtMoney2(job.revenue)} job · {pct2(calc.commissionPct)}% commission = {fmtMoney2(calc.commissionPool)}</div>
                    <div>{calc.shares.map(s => `${nameOf(s.techId)} ${pct2(s.pct)}% = ${fmtMoney2(s.amount)}`).join(' · ')}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

const JOB_FILTERS = [
  { id: 'all', label: 'All', test: () => true },
  { id: 'scheduled', label: 'Scheduled', test: (j) => j.status === 'Scheduled' },
  { id: 'completed', label: 'Completed', test: (j) => j.status === 'Completed' },
  { id: 'unpaid', label: 'Money Owed', test: (j) => jobPayments(j).outstanding > 0 },
  { id: 'paid', label: 'Paid in Full', test: (j) => jobPayments(j).fullyPaid },
];

function PaymentPicker({ paid, method, onPick }) {

function JobsTab({ jobs, techs, settings, onAdd, onEdit, onDelete, onSetPayment }) {
  const [filter, setFilter] = useState('all');
  const [picking, setPicking] = useState(null); // { id, which } of the payment being recorded
  // Scheduled work reads best soonest-first; everything else newest/highest-first.
  const [sortKey, setSortKey] = useState('scheduled');

  const visible = useMemo(() => {
    const test = (JOB_FILTERS.find(f => f.id === filter) || JOB_FILTERS[0]).test;
    const withCalc = jobs.filter(test).map(j => ({ job: j, calc: computeJobFinancials(j, settings) }));
    const cmp = {
      scheduled: (a, b) => scheduledOf(a.job).localeCompare(scheduledOf(b.job)),
      date: (a, b) => new Date(b.job.date) - new Date(a.job.date),
      profit: (a, b) => b.calc.profitWithLights - a.calc.profitWithLights,
      margin: (a, b) => b.calc.marginWithLights - a.calc.marginWithLights,
      revenue: (a, b) => (Number(b.job.revenue) || 0) - (Number(a.job.revenue) || 0),
      feet: (a, b) => (Number(b.job.feet) || 0) - (Number(a.job.feet) || 0),
    }[sortKey];
    return withCalc.sort(cmp);
  }, [jobs, settings, sortKey, filter]);

  const owedTotal = useMemo(
    () => visible.reduce((s, { job }) => s + jobPayments(job).outstanding, 0),
    [visible]
  );

  return (
    <div>
      <div className="row" style={{ marginBottom: 10 }}>
        <div className="section-title" style={{ marginBottom: 0 }}>Jobs ({visible.length})</div>
        <select className="sort-select" value={sortKey} onChange={e => setSortKey(e.target.value)}>
          <option value="scheduled">Scheduled date</option>
          <option value="date">Newest added</option>
          <option value="profit">Profit</option>
          <option value="margin">Margin %</option>
          <option value="revenue">Revenue</option>
          <option value="feet">Feet</option>
        </select>
      </div>

      <div className="filter-bar">
        {JOB_FILTERS.map(f => (
          <div key={f.id} className={"chip" + (filter === f.id ? ' active' : '')} onClick={() => setFilter(f.id)}>
            {f.label} ({jobs.filter(f.test).length})
          </div>
        ))}
      </div>

      {filter === 'unpaid' && visible.length > 0 && (
        <div className="card" style={{ padding: '10px 14px' }}>
          <div className="row">
            <span style={{ fontWeight: 700, fontSize: 13.5 }}>Total outstanding</span>
            <span style={{ fontWeight: 800, color: 'var(--loss)' }}>{fmtMoney2(owedTotal)}</span>
          </div>
        </div>
      )}

      {jobs.length === 0 ? (
        <div className="card"><div className="empty-state">
          <div className="big">🎅</div>
          No jobs yet. Tap + to add your first install.
        </div></div>
      ) : visible.length === 0 ? (
        <div className="card"><div className="empty-state">
          <div className="big">🔍</div>
          No jobs match this filter.
        </div></div>
      ) : visible.map(({ job, calc }) => {
        const pay = jobPayments(job);
        return (
          <div className="card job-card" key={job.id} onClick={() => onEdit(job)}>
            <div className="job-top">
              <div>
                <div className="job-customer">{job.customer || 'Untitled Job'}</div>
                <div className="job-sub">
                  📅 {fmtDateOnly(scheduledOf(job)) || 'No date'} · {(Number(job.feet) || 0).toLocaleString()} ft{job.rooflineColor ? ` ${job.rooflineColor}` : ''}
                  {calc.mini.charged > 0 && ` · ${calc.mini.charged} mini ball${calc.mini.charged === 1 ? '' : 's'}${calc.mini.usingEstimate ? ' (est.)' : ''}`}
                  {mockupIdsOf(job).length > 0 && ` · 🖼️ ${mockupIdsOf(job).length} picture${mockupIdsOf(job).length === 1 ? '' : 's'}`}
                </div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <span className={"badge " + (job.status === 'Completed' ? 'badge-done' : 'badge-sched')}>{job.status}</span>
                <button className="icon-btn danger" onClick={(e) => { e.stopPropagation(); if (confirm(`Delete job for ${job.customer}?`)) onDelete(job.id); }}>🗑️</button>
              </div>
            </div>
            <div className="job-metrics">
              <div className="metric"><div className="lbl">Revenue</div><div className="val">{fmtMoney(job.revenue)}</div></div>
              <div className="metric"><div className="lbl">Cost</div><div className="val">{fmtMoney(calc.costWithLights)}</div></div>
              <div className="metric"><div className="lbl">Profit</div><div className={"val " + (calc.profitWithLights >= 0 ? 'pos' : 'neg')}>{fmtMoney(calc.profitWithLights)}</div></div>
              <div className="metric"><div className="lbl">Margin</div><div className={"val " + (calc.profitWithLights >= 0 ? 'pos' : 'neg')}>{fmtPct(calc.marginWithLights)}</div></div>
            </div>
            <div className="pay-row">
              {[['deposit', 'Deposit', 'Deposit 50%', pay.deposit], ['balance', 'Balance', 'Balance due', pay.balance]].map(([which, name, unpaidLabel, amount]) => {
                const paid = !!job[which + 'Paid'];
                const method = job[which + 'Method'];
                const fee = cardFeeFor(job, which, amount, settings);
                const isPicking = picking && picking.id === job.id && picking.which === which;
                return (
                  <div key={which} className={"pay-btn" + (paid ? ' paid' : '') + (isPicking ? ' picking' : '')}
                    onClick={(e) => { e.stopPropagation(); setPicking(isPicking ? null : { id: job.id, which }); }}>
                    <span>{paid ? `✓ ${name}${method ? ' · ' + method : ' paid'}` : unpaidLabel}</span>
                    <span className="amt">{fmtMoney(amount)}</span>
                    {fee > 0 && <span className="fee">−{fmtMoney2(fee)} card fee</span>}
                  </div>
                );
              })}
            </div>
            {picking && picking.id === job.id && (
              <div onClick={e => e.stopPropagation()}>
                <div className="hint" style={{ marginTop: 8 }}>How was the {picking.which} paid?</div>
                <PaymentPicker
                  paid={!!job[picking.which + 'Paid']}
                  method={job[picking.which + 'Method'] || ''}
                  onPick={(paid, method) => { onSetPayment(job.id, picking.which, paid, method); setPicking(null); }} />
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function JobModal({ job, techs, settings, inventory, onClose, onSave }) {
  const isNew = !job.id;
  const [customer, setCustomer] = useState(job.customer || '');
  const [feet, setFeet] = useState(job.feet != null ? String(job.feet) : '');
  const [rooflineColor, setRooflineColor] = useState(job.rooflineColor || '');
  // Mini light color suggestions: what's in inventory first, then the usual colors.
  const miniColorOptions = [
    ...(inventory || []).filter(i => i.kind === 'mini' && i.name.trim()).map(i => i.name.trim()),
    ...MINI_LIGHT_COLORS,
  ].filter((c, i, all) => all.findIndex(o => sameName(o, c)) === i);
  const [revenue, setRevenue] = useState(job.revenue != null ? String(job.revenue) : '');
  const [status, setStatus] = useState(job.status || 'Scheduled');
  const [miscCost, setMiscCost] = useState(job.miscCost != null ? String(job.miscCost) : '');
  const [miscNote, setMiscNote] = useState(job.miscNote || '');
  const [date] = useState(job.date || new Date().toISOString());
  const [scheduledDate, setScheduledDate] = useState(job.scheduledDate || (job.date ? job.date.slice(0, 10) : todayYMD()));
  // Older jobs can be marked paid with no method recorded; keep them paid rather than reset.
  const [deposit, setDeposit] = useState({ paid: !!job.depositPaid, method: job.depositMethod || '' });
  const [balance, setBalance] = useState({ paid: !!job.balancePaid, method: job.balanceMethod || '' });
  const payFields = {
    ...paymentFields(job, 'deposit', deposit.paid, deposit.method, settings),
    ...paymentFields(job, 'balance', balance.paid, balance.method, settings),
  };
  // Each assigned tech has their own commission % (`pct`, unrounded). `text` holds what was
  // typed while editing; a % that wasn't typed keeps full precision instead of the rounded
  // number shown, so an exact third stays exact when the job is saved again.
  const defaultPct = Number(settings.commissionPct) || 0;
  const evenSplit = (list, total) => list.map(a => ({ techId: a.techId, pct: total / list.length }));
  const isEvenDefault = (list) => list.every(a => Math.abs(a.pct - defaultPct / list.length) < 0.001);
  const [assignments, setAssignments] = useState(() =>
    computeJobFinancials(job, settings).shares.map(s => ({ techId: s.techId, pct: s.pct })));
  // Until a tech's % is changed by hand, adding or removing techs re-splits the default evenly.
  const [custom, setCustom] = useState(() => assignments.length > 0 && !isEvenDefault(assignments));
  const pctText = (a) => a.text !== undefined ? a.text : String(pct2(a.pct));

  // Removed techs only appear on jobs they were already on, so past jobs still show them.
  const pickableTechs = techs.filter(t => !t.removed || (job.assignments || []).some(a => a.techId === t.id));

  const toggleTech = (tech, checked) => {
    setAssignments(prev => {
      const next = checked ? [...prev, { techId: tech.id, pct: 0 }] : prev.filter(a => a.techId !== tech.id);
      return custom || next.length === 0 ? next : evenSplit(next, defaultPct);
    });
  };
  const setTechPct = (techId, value) => {
    setCustom(true);
    setAssignments(prev => prev.map(a => a.techId === techId ? { ...a, text: value, pct: Number(value) || 0 } : a));
  };
  const splitEvenly = () => {
    const total = assignments.reduce((s, a) => s + a.pct, 0) || defaultPct;
    setAssignments(evenSplit(assignments, total));
    setCustom(Math.abs(total - defaultPct) >= 0.001);
  };

  // Mini lights: one row per color, with estimated and actual balls (kept as text while editing).
  const [miniLights, setMiniLights] = useState(() => (job.miniLights || []).map(r => ({
    id: r.id || uid(), color: r.color || '',
    est: blankNum(r.est) ? '' : String(r.est), actual: blankNum(r.actual) ? '' : String(r.actual),
  })));
  const addMiniRow = () => setMiniLights(rows => [...rows, { id: uid(), color: '', est: '', actual: '' }]);
  const updateMini = (id, patch) => setMiniLights(rows => rows.map(r => r.id === id ? { ...r, ...patch } : r));
  const removeMini = (id) => setMiniLights(rows => rows.filter(r => r.id !== id));

  // Mock-up pictures. Each tile is { key, id, url, state }: state is 'loading', 'ready',
  // 'missing' (saved, but not on this device yet) or 'new' (chosen now, stored on Save).
  // Adding or removing pictures only takes effect when the job is saved.
  const [pics, setPics] = useState(() => mockupIdsOf(job).map(id => ({ key: id, id, url: null, state: 'loading' })));
  const [removedIds, setRemovedIds] = useState([]);
  const [picMsg, setPicMsg] = useState('');
  const [dragOver, setDragOver] = useState(false);
  const [viewing, setViewing] = useState(null); // key of the picture shown full size
  useEffect(() => {
    let alive = true;
    mockupIdsOf(job).forEach(id => {
      loadMockup(id)
        .then(url => alive && setPics(ps => ps.map(p => p.id === id ? { ...p, url, state: url ? 'ready' : 'missing' } : p)))
        .catch(() => alive && setPics(ps => ps.map(p => p.id === id ? { ...p, state: 'missing' } : p)));
    });
    return () => { alive = false; };
  }, []);
  const addFiles = async (fileList) => {
    const all = [...(fileList || [])];
    const files = all.filter(f => f.type.startsWith('image/'));
    if (!files.length) { if (all.length) setPicMsg('Those files aren’t pictures.'); return; }
    setPicMsg(`Preparing ${files.length} picture${files.length === 1 ? '' : 's'}…`);
    let failed = 0;
    for (const f of files) {
      try {
        const url = await compressImage(f);
        setPics(ps => [...ps, { key: uid(), id: null, url, state: 'new' }]);
      } catch (e) { failed++; }
    }
    setPicMsg(failed ? `${failed} picture${failed === 1 ? '' : 's'} couldn’t be read. Try JPG or PNG.` : '');
  };
  const removePic = (key) => {
    const p = pics.find(x => x.key === key);
    if (p && p.id) setRemovedIds(r => [...r, p.id]);
    setPics(ps => ps.filter(x => x.key !== key));
  };
  const viewable = pics.filter(p => p.url);
  const viewIndex = viewable.findIndex(p => p.key === viewing);
  const stepView = (dir) => setViewing(viewable[(viewIndex + dir + viewable.length) % viewable.length].key);

  const previewJob = {
    feet: Number(feet) || 0,
    revenue: Number(revenue) || 0,
    miscCost: Number(miscCost) || 0,
    assignments: assignments.map(a => ({ techId: a.techId, pct: a.pct })),
    miniLights,
    ...payFields,
  };
  const calc = computeJobFinancials(previewJob, settings);
  const pay = jobPayments(previewJob);

  const save = async () => {
    if (!customer.trim()) { alert('Enter a customer name.'); return; }
    if (feet === '' || isNaN(Number(feet)) || Number(feet) < 0) { alert('Enter valid feet installed.'); return; }
    for (const r of miniLights) {
      for (const [key, what] of [['est', 'estimated'], ['actual', 'actual']]) {
        if (!blankNum(r[key]) && (isNaN(Number(r[key])) || Number(r[key]) < 0)) {
          alert(`Enter a valid ${what} number of mini light balls${r.color ? ' for ' + r.color : ''}.`); return;
        }
      }
    }
    if (revenue === '' || isNaN(Number(revenue)) || Number(revenue) < 0) { alert('Enter a valid revenue amount.'); return; }
    for (const a of assignments) {
      const typed = a.text !== undefined ? a.text : String(a.pct);
      const p = Number(typed);
      if (typed === '' || isNaN(p) || p < 0 || p > 100) {
        const name = (techs.find(t => t.id === a.techId) || {}).name || 'a tech';
        alert(`Enter a commission between 0 and 100% for ${name}.`); return;
      }
    }
    if (calc.commissionPct > 100) { alert('Total commission can’t be more than 100% of the job.'); return; }

    const jobId = job.id || uid();
    // Keep the pictures in the order shown. Ones not on this device yet are kept, not dropped.
    const mockupIds = [];
    let storeFailed = 0;
    for (const p of pics) {
      if (p.state !== 'new') { mockupIds.push(p.id); continue; }
      const newId = uid();
      try {
        await imgPut(newId, { dataUrl: p.url, jobId, uploaded: false });
        mockupIds.push(newId);
      } catch (e) { storeFailed++; }
    }
    if (storeFailed) alert(`Couldn’t store ${storeFailed} new picture${storeFailed === 1 ? '' : 's'} on this device, so the job will be saved without ${storeFailed === 1 ? 'it' : 'them'}.`);

    onSave({
      id: jobId,
      customer: customer.trim(),
      miniLights: miniLights
        .filter(r => r.color.trim() || !blankNum(r.est) || !blankNum(r.actual))
        .map(r => ({
          id: r.id, color: r.color.trim(),
          est: blankNum(r.est) ? null : Number(r.est),
          actual: blankNum(r.actual) ? null : Number(r.actual),
        })),
      ...(mockupIds.length ? { mockupIds } : {}),
      feet: Number(feet),
      ...(rooflineColor ? { rooflineColor } : {}),
      revenue: Number(revenue),
      status,
      scheduledDate,
      ...payFields,
      miscCost: Number(miscCost) || 0,
      miscNote: miscNote.trim(),
      date,
      assignments: previewJob.assignments,
    });
    removedIds.forEach(deleteMockup);
    pushPendingMockups();
  };

  return (
    <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="modal-head">
          <h2>{isNew ? 'New Job' : 'Edit Job'}</h2>
          <button className="close-x" onClick={onClose}>✕</button>
        </div>

        <label>Customer Name</label>
        <input type="text" value={customer} onChange={e => setCustomer(e.target.value)} placeholder="e.g. Smith Residence" autoFocus />

        <label>Scheduled For</label>
        <input type="date" value={scheduledDate} onChange={e => setScheduledDate(e.target.value)} />

        <div className="field-group">
          <div>
            <label>Feet Installed</label>
            <input type="number" inputMode="decimal" min="0" step="1" value={feet} onChange={e => setFeet(e.target.value)} placeholder="0" />
          </div>
          <div>
            <label>Job Revenue ($)</label>
            <input type="number" inputMode="decimal" min="0" step="1" value={revenue} onChange={e => setRevenue(e.target.value)} placeholder="0" />
          </div>
        </div>

        <label>Roofline Color</label>
        <div className="color-grid">
          {Object.keys(ROOFLINE_PATTERNS).map(name => (
            <div key={name} className={'pill color-pill' + (rooflineColor === name ? ' active' : '')}
              onClick={() => setRooflineColor(rooflineColor === name ? '' : name)}>
              <div>{name}</div>
              <div className="color-sub">{ROOFLINE_PATTERN_HINTS[name]}</div>
            </div>
          ))}
        </div>
        {Number(feet) > 0 && (() => {
          const sockets = socketsFor(Number(feet), settings);
          const intro = `${Number(feet).toLocaleString()} ft of ${spacingOf(settings)}″ line = ${sockets.toLocaleString()} bulbs`;
          if (!ROOFLINE_PATTERNS[rooflineColor]) return <div className="hint">{intro}. Pick a color so the bulbs count against your inventory.</div>;
          const split = bulbsByColor(ROOFLINE_PATTERNS[rooflineColor], sockets);
          return (
            <div className="hint">
              {intro}{split.length > 1 ? ': ' : ' '}
              <b>{split.map(([color, count]) => `${count.toLocaleString()} ${color}`).join(' · ')}</b>
            </div>
          );
        })()}
        <div className="hint">⏲ Plus <b>1 timer</b>. Every job gets one, and it’s counted in Inventory.</div>

        <label style={{ marginTop: 16 }}>Mini Lights</label>
        <div className="card" style={{ margin: 0, padding: 10 }}>
          {miniLights.length === 0 ? (
            <div className="hint" style={{ marginTop: 0 }}>No mini lights on this job yet.</div>
          ) : (
            <div className="mini-grid mini-head"><span>Color</span><span>Est. balls</span><span>Actual</span><span></span></div>
          )}
          {miniLights.map(r => (
            <div className="mini-grid" key={r.id}>
              <input type="text" list="mini-light-colors" value={r.color} placeholder="Color"
                onChange={e => updateMini(r.id, { color: e.target.value })} aria-label="Mini light color" />
              <input type="number" inputMode="numeric" min="0" step="1" value={r.est} placeholder="0"
                onChange={e => updateMini(r.id, { est: e.target.value })} aria-label="Estimated balls" />
              <input type="number" inputMode="numeric" min="0" step="1" value={r.actual} placeholder="—"
                onChange={e => updateMini(r.id, { actual: e.target.value })} aria-label="Actual balls used" />
              <button className="icon-btn danger" onClick={() => removeMini(r.id)} aria-label="Remove this color">✕</button>
            </div>
          ))}
          <datalist id="mini-light-colors">{miniColorOptions.map(c => <option key={c} value={c} />)}</datalist>
          <button className="btn btn-ghost btn-sm" style={{ marginTop: 8 }} onClick={addMiniRow}>+ Add color</button>
        </div>
        {miniLights.length > 0 && (
          <div className="hint">
            Estimated: <b>{calc.mini.est} balls</b> ({fmtMoney2(calc.mini.est * calc.mini.pricePerBall)})
            {calc.mini.actual > 0 && <React.Fragment> · Used: <b>{calc.mini.actual} balls</b> ({fmtMoney2(calc.mini.actual * calc.mini.pricePerBall)})</React.Fragment>}
            {' '}at {fmtMoney2(calc.mini.pricePerBall)} a ball. Each color’s actual count is what’s charged once you enter it; until then its estimate is used.
          </div>
        )}
        {status === 'Completed' && calc.mini.usingEstimate && (
          <div className="hint" style={{ color: 'var(--loss)' }}>⚠ This job is completed — enter the actual mini lights used.</div>
        )}

        <label style={{ marginTop: 16 }}>Mock-up Pictures{pics.length > 0 ? ` (${pics.length})` : ''}</label>
        {pics.length > 0 && (
          <div className="pic-grid">
            {pics.map((p, i) => (
              <div className="pic-tile" key={p.key}>
                {p.url
                  ? <img src={p.url} alt={`Mock-up ${i + 1}`} onClick={() => setViewing(p.key)} />

              </div>
            ))}

        )}
        <label className={'drop-zone' + (dragOver ? ' over' : '') + (pics.length ? ' compact' : '')}
          onDragOver={e => { e.preventDefault(); setDragOver(true); }}
          onDragLeave={() => setDragOver(false)}
          onDrop={e => { e.preventDefault(); setDragOver(false); addFiles(e.dataTransfer.files); }}>
          {pics.length === 0 && <div style={{ fontSize: 26 }}>🖼️</div>}
          <div>{pics.length === 0
            ? <React.Fragment><b>Drop mock-up pictures here</b> or tap to choose — you can add several</React.Fragment>
            : <React.Fragment><b>+ Add more pictures</b> (drop or tap)</React.Fragment>}</div>
          <input type="file" accept="image/*" multiple style={{ display: 'none' }}
            onChange={e => { addFiles(e.target.files); e.target.value = ''; }} />
        </label>
        {picMsg && <div className="hint">{picMsg}</div>}
        {pics.some(p => p.state === 'missing') && (
          <div className="hint">Some pictures aren’t on this device yet. They appear once the device that added them is online and signed in to Google sync.</div>
        )}
        {viewIndex >= 0 && (
          <div className="lightbox" onClick={() => setViewing(null)}>
            <img src={viewable[viewIndex].url} alt={`Mock-up ${viewIndex + 1}, full size`} />
            {viewable.length > 1 && (
              <React.Fragment>
                <button className="lightbox-nav prev" onClick={e => { e.stopPropagation(); stepView(-1); }} aria-label="Previous picture">‹</button>
                <button className="lightbox-nav next" onClick={e => { e.stopPropagation(); stepView(1); }} aria-label="Next picture">›</button>
              </React.Fragment>
            )}
            <div className="lightbox-close">{viewable.length > 1 ? `${viewIndex + 1} of ${viewable.length} · ` : ''}Tap anywhere to close</div>
          </div>
        )}

        <label>Status</label>
        <div className="pill-group">
          <div className={"pill" + (status === 'Scheduled' ? ' active' : '')} onClick={() => setStatus('Scheduled')}>Scheduled</div>
          <div className={"pill active gold" + (status === 'Completed' ? ' active' : '')} style={status !== 'Completed' ? { background: 'var(--white)', color: 'var(--muted)', borderColor: 'var(--border)' } : {}} onClick={() => setStatus('Completed')}>Completed</div>
        </div>

        <label style={{ marginTop: 16 }}>Payment</label>
        {[['deposit', 'Deposit 50%', pay.deposit, deposit, setDeposit], ['balance', 'Balance', pay.balance, balance, setBalance]].map(([which, name, amount, st, setSt]) => {
          const fee = cardFeeFor(previewJob, which, amount, settings);
          return (
            <div className="pay-line" key={which}>
              <div className="row">
                <span style={{ fontWeight: 700, fontSize: 14 }}>{name}</span>
                <span style={{ fontWeight: 800 }}>{fmtMoney2(amount)}</span>
              </div>
              <PaymentPicker paid={st.paid} method={st.method} onPick={(paid, method) => setSt({ paid, method })} />
              {st.paid && !st.method && <div className="hint">Marked paid, but how wasn't recorded — tap a method to add it.</div>}
              {fee > 0 && <div className="hint" style={{ color: 'var(--loss)' }}>Card fee ({feePctFor(previewJob, which, settings)}%): −{fmtMoney2(fee)}</div>}
            </div>
          );
        })}

        <label style={{ marginTop: 16 }}>Techs Assigned</label>
        <div className="card" style={{ margin: 0, padding: 10 }}>
          {pickableTechs.length === 0 ? (
            <div className="hint">No techs in your roster yet. Add techs from the Techs tab first.</div>
          ) : pickableTechs.map(t => {
            const a = assignments.find(x => x.techId === t.id);
            return (
              <React.Fragment key={t.id}>
                <div className="checkbox-row">
                  <input type="checkbox" checked={!!a} onChange={e => toggleTech(t, e.target.checked)} />
                  <div className="nm">{t.name}</div>
                  {a && (
                    <div className="tech-pct">
                      <input className="pct-input" type="number" inputMode="decimal" min="0" max="100" step="0.5"
                        value={pctText(a)} onChange={e => setTechPct(t.id, e.target.value)} aria-label={`${t.name} commission %`} />
                      <span className="tech-meta">%</span>
                      <span className="tech-amt">{fmtMoney2(calc.payByTech[t.id] || 0)}</span>
                    </div>
                  )}
                </div>
              </React.Fragment>
            );
          })}
        </div>
        <div className="hint" style={{ marginTop: 6 }}>
          {calc.techCount === 0
            ? `No techs assigned yet, so no commission is counted. Techs you add start with your ${defaultPct}% default, split evenly; then change anyone's %.`
            : <React.Fragment>
                Commission: <b>{pct2(calc.commissionPct)}%</b> of {fmtMoney2(previewJob.revenue)} = <b>{fmtMoney2(calc.commissionPool)}</b>.
                {' '}Each tech's % is of the whole job's revenue.
              </React.Fragment>}
        </div>
        {calc.techCount > 1 && (
          <button className="btn btn-ghost btn-sm" style={{ marginTop: 8 }} onClick={splitEvenly}>

        <label>Misc / Materials Cost ($)</label>
        <input type="number" inputMode="decimal" min="0" step="0.01" value={miscCost} onChange={e => setMiscCost(e.target.value)} placeholder="0.00" />
        <label>Note (optional)</label>
        <input type="text" value={miscNote} onChange={e => setMiscNote(e.target.value)} placeholder="clips, timers, extension cords, gas..." />

        <div className="summary-box">
          <div className="row"><span className="lab">Commission ({pct2(calc.commissionPct)}%{calc.techCount ? `, ${calc.techCount} ${calc.techCount === 1 ? 'tech' : 'techs'}` : ', no techs'})</span><span>{fmtMoney2(calc.commissionPool)}</span></div>
          <div className="row"><span className="lab">Card fees</span><span>{fmtMoney2(calc.cardFees)}</span></div>
          <div className="row"><span className="lab">Misc / materials</span><span>{fmtMoney2(previewJob.miscCost)}</span></div>
          <div className="row"><span className="lab">Lights ({calc.feet.toLocaleString()} ft × ${calc.lightCostPerFt.toFixed(2)})</span><span>{fmtMoney2(calc.lightCost)}</span></div>
          <div className="row"><span className="lab">Mini lights ({calc.mini.charged} balls × {fmtMoney2(calc.mini.pricePerBall)}{calc.mini.usingEstimate ? ', est.' : ''})</span><span>{fmtMoney2(calc.mini.cost)}</span></div>
          <div className="row total"><span className="lab">Total cost</span><span>{fmtMoney2(calc.costWithLights)}</span></div>
          <div className="row total"><span className="lab">Net profit</span><span>{fmtMoney2(calc.profitWithLights)}</span></div>
          <div className="row"><span className="lab">Margin</span><span>{fmtPct(calc.marginWithLights)}</span></div>
        </div>
        <div className="hint" style={{ marginTop: 6 }}>
          Lights are only subtracted here and on the Jobs tab. The Dashboard leaves them out because they're logged as an expense, so it will count this job's profit as {fmtMoney2(calc.netProfit)}.
        </div>

        <div style={{ display: 'flex', gap: 10, marginTop: 18 }}>
          <button className="btn btn-ghost" style={{ flex: 1 }} onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" style={{ flex: 2 }} onClick={save}>Save Job</button>
        </div>
      </div>
    </div>
  );
}
