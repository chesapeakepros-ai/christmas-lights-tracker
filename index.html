function ExpenseModal({ expense, onClose, onSave }) {
  const isNew = !expense.id;
  const [date, setDate] = useState(expense.date || todayYMD());
  const [category, setCategory] = useState(expense.category || EXPENSE_CATEGORIES[0]);
  const [description, setDescription] = useState(expense.description || '');
  const [amount, setAmount] = useState(expense.amount != null ? String(expense.amount) : '');

  const save = () => {
    if (!date) { alert('Pick a date.'); return; }
    if (amount === '' || isNaN(Number(amount)) || Number(amount) < 0) { alert('Enter a valid amount.'); return; }
    onSave({ id: expense.id || uid(), date, category, description: description.trim(), amount: Number(amount) });
  };

  return (
    <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="modal-head">
          <h2>{isNew ? 'Add Expense' : 'Edit Expense'}</h2>
          <button className="close-x" onClick={onClose}>✕</button>
        </div>

        <label>Date</label>
        <input type="date" value={date} onChange={e => setDate(e.target.value)} autoFocus />

        <label>Category</label>
        <select value={category} onChange={e => setCategory(e.target.value)}>
          {EXPENSE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
        </select>

        <label>Description (optional)</label>
        <input type="text" value={description} onChange={e => setDescription(e.target.value)} placeholder="e.g. Truck insurance premium" />

        <label>Amount ($)</label>
        <input type="number" inputMode="decimal" min="0" step="0.01" value={amount} onChange={e => setAmount(e.target.value)} placeholder="0.00" />

        <div style={{ display: 'flex', gap: 10, marginTop: 18 }}>
          <button className="btn btn-ghost" style={{ flex: 1 }} onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" style={{ flex: 2 }} onClick={save}>Save Expense</button>
        </div>
      </div>
    </div>
  );
}

// ================= Dashboard =================
function DashboardTab({ jobs, techs, expenses, settings }) {
  const [sortKey, setSortKey] = useState('profit');
  const [sortDir, setSortDir] = useState('desc');
  const barRef = useRef(null);
  const lineRef = useRef(null);
  const barChart = useRef(null);
  const lineChart = useRef(null);

  // Every figure below counts only completed jobs that are paid in full.
  const calcs = useMemo(
    () => jobs.filter(isRealized).map(j => ({ job: j, calc: computeJobFinancials(j, settings) })),
    [jobs, settings]
  );
  const pending = useMemo(() => {
    const notCounted = jobs.filter(j => !isRealized(j));
    return { count: notCounted.length, revenue: notCounted.reduce((s, j) => s + (Number(j.revenue) || 0), 0) };
  }, [jobs]);

  const totals = useMemo(() => {
    const revenue = calcs.reduce((s, c) => s + (Number(c.job.revenue) || 0), 0);
    const cost = calcs.reduce((s, c) => s + c.calc.totalCost, 0);
    const cardFees = calcs.reduce((s, c) => s + c.calc.cardFees, 0);
    const profit = revenue - cost;
    const margins = calcs.filter(c => c.job.revenue > 0).map(c => c.calc.margin);
    const avgMargin = margins.length ? margins.reduce((s, m) => s + m, 0) / margins.length : 0;
    const expensesTotal = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
    const trueProfit = profit - expensesTotal;
    return { revenue, cost, cardFees, profit, avgMargin, expensesTotal, trueProfit };
  }, [calcs, expenses]);

  const sortedJobs = useMemo(() => {
    const arr = [...calcs];
    const dir = sortDir === 'asc' ? 1 : -1;
    const val = (c) => ({
      customer: c.job.customer.toLowerCase(),
      revenue: Number(c.job.revenue) || 0,
      feet: Number(c.job.feet) || 0,
      cost: c.calc.totalCost,
      profit: c.calc.netProfit,
      margin: c.calc.margin,
    }[sortKey]);
    arr.sort((a, b) => {
      const va = val(a), vb = val(b);
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });
    return arr;
  }, [calcs, sortKey, sortDir]);

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('desc'); }
  };

  const perTech = useMemo(() => {
    return techs.map(t => {
      let revenue = 0, pay = 0, jobCount = 0;
      calcs.forEach(({ job, calc }) => {
        if (!(job.assignments || []).some(x => x.techId === t.id)) return;
        jobCount += 1;
        revenue += Number(job.revenue) || 0;
        pay += calc.payByTech[t.id] || 0;
      });
      return { tech: t, revenue, pay, jobCount };
    }).filter(pt => !pt.tech.removed || pt.jobCount > 0);
  }, [techs, calcs]);

  useEffect(() => {
    if (!window.Chart) return;
    const chronological = [...calcs].sort((a, b) => new Date(a.job.date) - new Date(b.job.date));

    if (barChart.current) barChart.current.destroy();
    if (barRef.current) {
      barChart.current = new Chart(barRef.current, {
        type: 'bar',
        data: {
          labels: chronological.map(c => c.job.customer || 'Job'),
          datasets: [{
            label: 'Profit',
            data: chronological.map(c => c.calc.netProfit),
            backgroundColor: chronological.map(c => c.calc.netProfit >= 0 ? '#196b40' : '#b0242a'),
            borderRadius: 4,
          }],
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { y: { ticks: { callback: v => '$' + v } } },
        },
      });
    }

    if (lineChart.current) lineChart.current.destroy();
    if (lineRef.current) {
      lineChart.current = new Chart(lineRef.current, {
        type: 'line',
        data: {
          labels: chronological.map(c => fmtDate(c.job.date)),
          datasets: [
            { label: 'Revenue', data: chronological.map(c => Number(c.job.revenue) || 0), borderColor: '#d4a017', backgroundColor: 'rgba(212,160,23,.15)', tension: .3, fill: true },
            { label: 'Cost', data: chronological.map(c => c.calc.totalCost), borderColor: '#b0242a', backgroundColor: 'rgba(176,36,42,.12)', tension: .3, fill: true },
          ],
        },
        options: {
          plugins: { legend: { position: 'bottom' } },
          scales: { y: { ticks: { callback: v => '$' + v } } },
        },
      });
    }
    return () => { if (barChart.current) barChart.current.destroy(); if (lineChart.current) lineChart.current.destroy(); };
  }, [calcs]);

  const sortArrow = (key) => sortKey === key ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';

  return (
    <div>
      <div className="section-title">Overview</div>
      <div className="stat-grid" style={{ marginBottom: 14 }}>
        <div className="stat-card"><div className="lbl">Total Revenue</div><div className="val">{fmtMoney(totals.revenue)}</div></div>
        <div className="stat-card"><div className="lbl">Total Cost</div><div className="val">{fmtMoney(totals.cost)}</div></div>
        <div className="stat-card"><div className="lbl">Net Profit</div><div className="val" style={{ color: totals.profit >= 0 ? 'var(--profit)' : 'var(--loss)' }}>{fmtMoney(totals.profit)}</div></div>
        <div className="stat-card"><div className="lbl">Avg Margin</div><div className="val">{fmtPct(totals.avgMargin)}</div></div>
      </div>
      <div className="hint" style={{ marginTop: -6, marginBottom: 12 }}>
        Counts only jobs that are <b>completed and paid in full</b> ({calcs.length} {calcs.length === 1 ? 'job' : 'jobs'}).
        {' '}Job costs here leave out the lights (they're in Expenses), so job profit runs higher than on the Jobs tab.
        {pending.count > 0 && ` Not counted yet: ${pending.count} ${pending.count === 1 ? 'job' : 'jobs'} worth ${fmtMoney(pending.revenue)} (scheduled, or still owed money).`}
        {totals.cardFees > 0 && ` Costs include ${fmtMoney2(totals.cardFees)} in card fees.`}
      </div>

      <div className="summary-box" style={{ marginTop: 0, marginBottom: 14 }}>
        <div className="row"><span className="lab">Job profit (revenue − job costs)</span><span>{fmtMoney2(totals.profit)}</span></div>
        <div className="row"><span className="lab">Business expenses</span><span>−{fmtMoney2(totals.expensesTotal)}</span></div>
        <div className="row total"><span className="lab">True Net Profit</span><span style={{ color: totals.trueProfit >= 0 ? '#8fe3ab' : '#ff9d9d' }}>{fmtMoney2(totals.trueProfit)}</span></div>
      </div>

      {calcs.length === 0 ? (
        <div className="card"><div className="empty-state"><div className="big">📊</div>
          {jobs.length === 0
            ? 'Add some jobs to see your dashboard.'
            : 'No completed, fully paid jobs yet. Jobs show up here once they’re marked Completed and both the deposit and balance are recorded as paid.'}
        </div></div>
      ) : (
        <React.Fragment>
          <div className="card">
            <div className="section-title">Job Profitability</div>
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th className={sortKey === 'customer' ? 'sorted' : ''} onClick={() => toggleSort('customer')}>Customer{sortArrow('customer')}</th>
                    <th className={"num" + (sortKey === 'feet' ? ' sorted' : '')} onClick={() => toggleSort('feet')}>Feet{sortArrow('feet')}</th>
                    <th className={"num" + (sortKey === 'revenue' ? ' sorted' : '')} onClick={() => toggleSort('revenue')}>Rev{sortArrow('revenue')}</th>
                    <th className={"num" + (sortKey === 'profit' ? ' sorted' : '')} onClick={() => toggleSort('profit')}>Profit{sortArrow('profit')}</th>
                    <th className={"num" + (sortKey === 'margin' ? ' sorted' : '')} onClick={() => toggleSort('margin')}>Margin{sortArrow('margin')}</th>
                  </tr>
                </thead>
                <tbody>
                  {sortedJobs.map(({ job, calc }) => (
                    <tr key={job.id}>
                      <td>{job.customer}</td>
                      <td className="num">{Number(job.feet) || 0}</td>
                      <td className="num">{fmtMoney(job.revenue)}</td>
                      <td className="num" style={{ color: calc.netProfit >= 0 ? 'var(--profit)' : 'var(--loss)', fontWeight: 700 }}>{fmtMoney(calc.netProfit)}</td>
                      <td className="num">{fmtPct(calc.margin)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <div className="card">
            <div className="section-title">Per-Tech Breakdown</div>
            {perTech.length === 0 ? <div className="hint">No techs yet.</div> : (
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr><th>Tech</th><th className="num">Jobs</th><th className="num">Job Revenue</th><th className="num">Commission</th></tr>
                  </thead>
                  <tbody>
                    {perTech.map(pt => (
                      <tr key={pt.tech.id}>
                        <td>{pt.tech.name}</td>
                        <td className="num">{pt.jobCount}</td>
                        <td className="num">{fmtMoney(pt.revenue)}</td>
                        <td className="num" style={{ fontWeight: 700 }}>{fmtMoney(pt.pay)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          <div className="card">
            <div className="section-title">Profit per Job</div>
            <canvas ref={barRef} height="180"></canvas>
          </div>
          <div className="card">
            <div className="section-title">Revenue vs Cost Over Time</div>
            <canvas ref={lineRef} height="180"></canvas>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// ================= Settings =================
function SettingsTab({ settings, setSettings, techs, onAddTech, onEditTech, onDeleteTech, jobs, onEditJob, onDeleteJob, expenses, onEditExpense, onDeleteExpense, inventory, user, syncState, authError, signIn, signOut, onImport }) {
  const [commStr, setCommStr] = useState(String(settings.commissionPct));
  const [feeStr, setFeeStr] = useState(String(settings.cardFeePct));
  const saveCardFee = () => {
    const v = Number(feeStr);
    if (feeStr === '' || isNaN(v) || v < 0 || v > 100) { alert('Enter a card fee between 0 and 100%.'); setFeeStr(String(settings.cardFeePct)); return; }
    setSettings(s => ({ ...s, cardFeePct: v }));
  };
  const [miniStr, setMiniStr] = useState(String(settings.miniLightCostPerBall));
  const saveMiniCost = () => {
    const v = Number(miniStr);
    if (miniStr === '' || isNaN(v) || v < 0) { alert('Enter a valid cost per ball of mini lights.'); setMiniStr(String(settings.miniLightCostPerBall)); return; }
    setSettings(s => ({ ...s, miniLightCostPerBall: v }));
  };
  const [spacingStr, setSpacingStr] = useState(String(spacingOf(settings)));
  const saveSpacing = () => {
    const v = Number(spacingStr);
    if (spacingStr === '' || isNaN(v) || v <= 0) { alert('Enter the bulb spacing in inches (more than 0).'); setSpacingStr(String(spacingOf(settings))); return; }
    setSettings(s => ({ ...s, bulbSpacingIn: v }));
  };
  const [lightStr, setLightStr] = useState(String(settings.lightCostPerFt));
  const saveLightCost = () => {
    const v = Number(lightStr);
    if (lightStr === '' || isNaN(v) || v < 0) { alert('Enter a valid light cost per foot.'); setLightStr(String(settings.lightCostPerFt)); return; }
    setSettings(s => ({ ...s, lightCostPerFt: v }));
  };
  const backups = lsGet(BACKUP_KEY, []).slice().reverse();

  const saveCommission = () => {
    const v = Number(commStr);
    if (commStr === '' || isNaN(v) || v < 0 || v > 100) { alert('Enter a commission between 0 and 100%.'); setCommStr(String(settings.commissionPct)); return; }
    setSettings(s => ({ ...s, commissionPct: v }));
  };

  const [importMsg, setImportMsg] = useState('');
  const exportBackup = () => {
    const payload = { app: 'xmasLightsTracker', exportedAt: new Date().toISOString(), techs, jobs, expenses, settings, inventory };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `christmas-lights-backup-${todayYMD()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const importBackup = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      let d;
      try { d = JSON.parse(ev.target.result); } catch (err) { setImportMsg('That file is not a valid backup.'); return; }
      if (!d || !Array.isArray(d.jobs) || !Array.isArray(d.techs)) { setImportMsg('That file does not look like a Christmas Lights backup.'); return; }
      const counts = `${d.techs.length} techs, ${d.jobs.length} jobs, ${(d.expenses || []).length} expenses${Array.isArray(d.inventory) ? `, ${d.inventory.length} inventory items` : ''}`;
      if (!confirm(`Import this backup (${counts})?\n\nIt REPLACES all current data here, and on your other devices once synced.`)) return;
      onImport(d);
      setImportMsg(`Imported ${counts}.`);
    };
    reader.readAsText(file);
  };

  return (
    <div>
      <div className="card">
        <div className="section-title">Google Sync</div>
        {user ? (
          <div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
              {user.photoURL && <img src={user.photoURL} alt="" style={{ width: 40, height: 40, borderRadius: '50%', border: '2px solid var(--gold)' }} />}
              <div>
                <div className="tech-name">{user.displayName}</div>
                <div className="tech-meta">{user.email}</div>
              </div>
            </div>
            <div className="hint" style={{ marginBottom: 10 }}>
              {syncState === 'error' ? '⚠️ Could not reach the cloud. Your data is safe on this device and will retry automatically.' : '✅ Your data syncs automatically across all devices signed in with this account.'}
            </div>
            <button className="btn btn-ghost btn-block" onClick={signOut}>Sign Out</button>
          </div>
        ) : IS_FILE ? (
          <div>
            <div className="hint" style={{ marginBottom: 10 }}>
              You opened the copy saved on this computer. Google sign-in only works from the web version:
            </div>
            <a className="btn btn-primary btn-block" href={LIVE_URL} style={{ textDecoration: 'none' }}>Open the web version</a>
            <div className="hint" style={{ marginTop: 10 }}>
              Data entered in this copy stays in this copy. To move it over, tap <b>Export backup</b> below, then <b>Import backup</b> on the web version.
            </div>
          </div>
        ) : (
          <div>
            <div className="hint" style={{ marginBottom: 10 }}>Sign in with Google to sync your data between your phone and computer automatically.</div>
            <button className="btn-google" style={{ width: '100%', justifyContent: 'center' }} onClick={signIn}>
              <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
              Sign in with Google
            </button>
          </div>
        )}
        {authError && <div className="msg-err">{authError}</div>}
      </div>

      <div className="card">
        <div className="section-title">Roofline Line</div>
        <label>Bulb Spacing on Your Line (inches)</label>
        <div className="field-group">
          <input type="number" inputMode="decimal" min="1" step="1" value={spacingStr}
            onChange={e => setSpacingStr(e.target.value)} onBlur={saveSpacing} />
          <button className="btn btn-primary" style={{ flex: '0 0 auto' }} onClick={saveSpacing}>Save</button>
        </div>
        <div className="hint">Used to work out how many bulbs each job needs from its feet: at {spacingOf(settings)}″, 100 ft of line takes {socketsFor(100, settings)} bulbs.</div>
      </div>

      <div className="card">
        <div className="section-title">Light Costs</div>
        <label>Cost of Lights per Foot ($/ft)</label>
        <div className="field-group">
          <input type="number" inputMode="decimal" min="0" step="0.01" value={lightStr}
            onChange={e => setLightStr(e.target.value)} onBlur={saveLightCost} />
          <button className="btn btn-primary" style={{ flex: '0 0 auto' }} onClick={saveLightCost}>Save</button>
        </div>
        <label>Cost per Ball of Mini Lights ($)</label>
        <div className="field-group">
          <input type="number" inputMode="decimal" min="0" step="0.01" value={miniStr}
            onChange={e => setMiniStr(e.target.value)} onBlur={saveMiniCost} />
          <button className="btn btn-primary" style={{ flex: '0 0 auto' }} onClick={saveMiniCost}>Save</button>
        </div>
        <div className="hint">Both are subtracted from each job on the Jobs tab (feet installed, and mini light balls used) so you can see that job's true profit. The Dashboard leaves them out, because the lights are already logged as an expense.</div>
      </div>

      <div className="card">
        <div className="section-title">Tech Commission</div>
        <label>Starting Commission per Job (% of job revenue)</label>
        <div className="field-group">
          <input type="number" inputMode="decimal" min="0" max="100" step="0.5" value={commStr}
            onChange={e => setCommStr(e.target.value)} onBlur={saveCommission} />
          <button className="btn btn-primary" style={{ flex: '0 0 auto' }} onClick={saveCommission}>Save</button>
        </div>
        <div className="hint">When you add techs to a job, this % of the job's revenue is split evenly between them as a starting point. Then set any tech's own % on that job. Each job keeps the %s it was saved with, so changing this only affects jobs you set up afterwards.</div>
      </div>

      <div className="card">
        <div className="section-title">Card Processing Fee</div>
        <label>Fee on Card Payments (%)</label>
        <div className="field-group">
          <input type="number" inputMode="decimal" min="0" max="100" step="0.1" value={feeStr}
            onChange={e => setFeeStr(e.target.value)} onBlur={saveCardFee} />
          <button className="btn btn-primary" style={{ flex: '0 0 auto' }} onClick={saveCardFee}>Save</button>
        </div>
        <div className="hint">Taken off any deposit or balance recorded as paid by Card, and counted as a job cost. Each card payment keeps the fee % it was recorded with, so changing this later only affects new card payments.</div>
      </div>

      <div className="card">
        <div className="row" style={{ marginBottom: techs.length ? 8 : 0 }}>
          <div className="section-title" style={{ marginBottom: 0 }}>Tech Roster</div>
          <button className="btn btn-primary btn-sm" onClick={onAddTech}>+ Add</button>
        </div>
        {techs.length === 0 ? <div className="hint">No techs yet.</div> : techs.map(t => (
          <div className="tech-row" key={t.id}>
            <div>
              <div className="tech-name">{t.name}</div>
              <div className="tech-meta">Paid by commission</div>
            </div>
            <div>
              <button className="icon-btn" onClick={() => onEditTech(t)}>✏️</button>
              <button className="icon-btn danger" onClick={() => { if (confirm(`Remove ${t.name}? They'll come off jobs that aren't completed yet. Completed jobs keep them, so past payouts don't change.`)) onDeleteTech(t.id); }}>🗑️</button>
            </div>
          </div>
        ))}
      </div>

      <div className="card">
        <div className="section-title">All Jobs ({jobs.length})</div>
        {jobs.length === 0 ? <div className="hint">No jobs yet.</div> : jobs.map(j => (
          <div className="tech-row" key={j.id}>
            <div>
              <div className="tech-name">{j.customer}</div>
              <div className="tech-meta">{fmtDate(j.date)} · {j.status}</div>
            </div>
            <div>
              <button className="icon-btn" onClick={() => onEditJob(j)}>✏️</button>
              <button className="icon-btn danger" onClick={() => { if (confirm(`Delete job for ${j.customer}?`)) onDeleteJob(j.id); }}>🗑️</button>
            </div>
          </div>
        ))}
      </div>

      <div className="card">
        <div className="section-title">All Expenses ({expenses.length})</div>
        {expenses.length === 0 ? <div className="hint">No expenses yet.</div> : expenses.map(ex => (
          <div className="tech-row" key={ex.id}>
            <div>
              <div className="tech-name">{ex.description || ex.category}</div>
              <div className="tech-meta">{fmtDateOnly(ex.date)} · {ex.category} · {fmtMoney2(ex.amount)}</div>
            </div>
            <div>
              <button className="icon-btn" onClick={() => onEditExpense(ex)}>✏️</button>
              <button className="icon-btn danger" onClick={() => { if (confirm('Delete this expense?')) onDeleteExpense(ex.id); }}>🗑️</button>
            </div>
          </div>
        ))}
      </div>

      <div className="card">
        <div className="section-title">Backup File</div>
        <div className="hint" style={{ marginBottom: 10 }}>Save all your data to a file, or load it from one — for moving data between copies of the app or keeping your own backup. Mock-up pictures aren’t included in the file.</div>
        <div className="field-group">
          <button className="btn btn-primary" style={{ flex: 1 }} onClick={exportBackup}>Export backup</button>
          <label className="btn btn-ghost" style={{ flex: 1, margin: 0, color: 'var(--text)', fontSize: 14.5 }}>
            Import backup
            <input type="file" accept="application/json,.json" onChange={importBackup} style={{ display: 'none' }} />
          </label>
        </div>
        {importMsg && <div className="hint" style={{ marginTop: 8 }}>{importMsg}</div>}
      </div>

      <div className="card">
        <div className="section-title">Automatic Backups</div>
        <div className="hint" style={{ marginBottom: 6 }}>A snapshot of your data is saved on this device once a day (last 14 days).</div>
        {backups.length === 0 ? <div className="hint">No backups yet.</div> : backups.map(b => (
          <div className="tech-row" key={b.day}>
            <div>
              <div className="tech-name">{fmtDate(b.ts)}</div>
              <div className="tech-meta">{(b.data.techs || []).length} techs · {(b.data.jobs || []).length} jobs · {(b.data.expenses || []).length} expenses{Array.isArray(b.data.inventory) ? ` · ${b.data.inventory.length} inventory items` : ''}</div>
            </div>
            <button className="btn btn-ghost btn-sm" onClick={() => { if (confirm('Restore this backup? It REPLACES all current data on every synced device.')) onImport(b.data); }}>Restore</button>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
