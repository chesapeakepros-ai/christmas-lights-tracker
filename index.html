function JobsTab({ jobs, techs, settings, onAdd, onEdit, onDelete, onSetPayment }) {
  const [filter, setFilter] = useState('all');
  const [picking, setPicking] = useState(null); // { id, which } of the payment being recorded
  // Scheduled work reads best soonest-first; everything else newest/highest-first.
  const [sortKey, setSortKey] = useState('scheduled');
  const [search, setSearch] = useState('');

  const visible = useMemo(() => {
    const test = (JOB_FILTERS.find(f => f.id === filter) || JOB_FILTERS[0]).test;
    const q = search.trim().toLowerCase();
    const matches = (j) => !q || (j.customer || '').toLowerCase().includes(q);
    const withCalc = jobs.filter(j => test(j) && matches(j)).map(j => ({ job: j, calc: computeJobFinancials(j, settings) }));
    const cmp = {
      scheduled: (a, b) => scheduledOf(a.job).localeCompare(scheduledOf(b.job)),
      date: (a, b) => new Date(b.job.date) - new Date(a.job.date),
      profit: (a, b) => b.calc.profitWithLights - a.calc.profitWithLights,
      margin: (a, b) => b.calc.marginWithLights - a.calc.marginWithLights,
      revenue: (a, b) => (Number(b.job.revenue) || 0) - (Number(a.job.revenue) || 0),
      feet: (a, b) => (Number(b.job.feet) || 0) - (Number(a.job.feet) || 0),
    }[sortKey];
    return withCalc.sort(cmp);
  }, [jobs, settings, sortKey, filter, search]);

  const owedTotal = useMemo(
    () => visible.reduce((s, { job }) => s + jobPayments(job).outstanding, 0),
    [visible]
  );

  return (
    <div>
      <div className="toolbar">
        <div className="search">
          <Icon name="search" />
          <input type="search" value={search} onChange={e => setSearch(e.target.value)} placeholder="Search jobs" aria-label="Search jobs by customer" />
        </div>
        <select className="sort-select" value={sortKey} onChange={e => setSortKey(e.target.value)} aria-label="Sort jobs">
          <option value="scheduled">Soonest</option>
          <option value="date">Newest</option>
          <option value="profit">Profit</option>
          <option value="margin">Margin %</option>
          <option value="revenue">Revenue</option>
          <option value="feet">Feet</option>
        </select>
      </div>

      <div className="filter-bar">
        {JOB_FILTERS.map(f => (
          <div key={f.id} className={"chip" + (filter === f.id ? ' active' : '')} onClick={() => setFilter(f.id)}>
            {f.label} ({jobs.filter(f.test).length})
          </div>
        ))}
      </div>

      {filter === 'unpaid' && visible.length > 0 && (
        <div className="card" style={{ padding: '10px 14px' }}>
          <div className="row">
            <span style={{ fontWeight: 700, fontSize: 13.5 }}>Total outstanding</span>
            <span style={{ fontWeight: 800, color: 'var(--loss)' }}>{fmtMoney2(owedTotal)}</span>
          </div>
        </div>
      )}

      {jobs.length === 0 ? (
        <div className="card"><div className="empty-state">
          <div className="big">🎅</div>
          No jobs yet. Tap <b>New job</b> to add your first install.
        </div></div>
      ) : visible.length === 0 ? (
        <div className="card"><div className="empty-state">
          <div className="big">🔍</div>
          {search.trim() ? `No jobs match “${search.trim()}”.` : 'No jobs match this filter.'}
        </div></div>
      ) : <div className="job-list">{visible.map(({ job, calc }) => {
        const pay = jobPayments(job);
        return (
          <div className="card job-card" key={job.id} onClick={() => onEdit(job)}>
            <div className="job-top">
              <div>
                <div className="job-customer">{job.customer || 'Untitled Job'}</div>
                <div className="job-sub">
                  📅 {fmtDateOnly(scheduledOf(job)) || 'No date'} · {(Number(job.feet) || 0).toLocaleString()} ft{job.rooflineColor ? ` ${job.rooflineColor}` : ''}
                  {calc.mini.charged > 0 && ` · ${calc.mini.charged} mini ball${calc.mini.charged === 1 ? '' : 's'}${calc.mini.usingEstimate ? ' (est.)' : ''}`}
                  {mockupIdsOf(job).length > 0 && ` · 🖼️ ${mockupIdsOf(job).length} picture${mockupIdsOf(job).length === 1 ? '' : 's'}`}
                </div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <span className={"badge " + (job.status === 'Completed' ? 'badge-done' : 'badge-sched')}>{job.status}</span>
                <button className="icon-btn danger" aria-label={`Delete job for ${job.customer}`} onClick={(e) => { e.stopPropagation(); if (confirm(`Delete job for ${job.customer}?`)) onDelete(job.id); }}><Icon name="trash" /></button>
              </div>
            </div>
            <div className="job-metrics">
              <div className="metric"><div className="lbl">Revenue</div><div className="val">{fmtMoney(job.revenue)}</div></div>
              <div className="metric"><div className="lbl">Cost</div><div className="val">{fmtMoney(calc.costWithLights)}</div></div>
              <div className="metric"><div className="lbl">Profit</div><div className={"val " + (calc.profitWithLights >= 0 ? 'pos' : 'neg')}>{fmtMoney(calc.profitWithLights)}</div></div>
              <div className="metric"><div className="lbl">Margin</div><div className={"val " + (calc.profitWithLights >= 0 ? 'pos' : 'neg')}>{fmtPct(calc.marginWithLights)}</div></div>
            </div>
            <div className="pay-row">
              {[['deposit', 'Deposit', 'Deposit 50%', pay.deposit], ['balance', 'Balance', 'Balance due', pay.balance]].map(([which, name, unpaidLabel, amount]) => {
                const paid = !!job[which + 'Paid'];
                const method = job[which + 'Method'];
                const fee = cardFeeFor(job, which, amount, settings);
                const isPicking = picking && picking.id === job.id && picking.which === which;
                return (
                  <div key={which} className={"pay-btn" + (paid ? ' paid' : '') + (isPicking ? ' picking' : '')}
                    onClick={(e) => { e.stopPropagation(); setPicking(isPicking ? null : { id: job.id, which }); }}>
                    <span>{paid ? `✓ ${name}${method ? ' · ' + method : ' paid'}` : unpaidLabel}</span>
                    <span className="amt">{fmtMoney(amount)}</span>
                    {fee > 0 && <span className="fee">−{fmtMoney2(fee)} card fee</span>}
                  </div>
                );
              })}
            </div>
            {picking && picking.id === job.id && (
              <div onClick={e => e.stopPropagation()}>
                <div className="hint" style={{ marginTop: 8 }}>How was the {picking.which} paid?</div>
                <PaymentPicker
                  paid={!!job[picking.which + 'Paid']}
                  method={job[picking.which + 'Method'] || ''}
                  onPick={(paid, method) => { onSetPayment(job.id, picking.which, paid, method); setPicking(null); }} />
              </div>
            )}
          </div>
        );
      })}</div>}
    </div>
  );
}

function JobModal({ job, techs, settings, inventory, onClose, onSave }) {
  const isNew = !job.id;
  const [customer, setCustomer] = useState(job.customer || '');
  const [feet, setFeet] = useState(job.feet != null ? String(job.feet) : '');
  const [rooflineColor, setRooflineColor] = useState(job.rooflineColor || '');
  // Mini light color suggestions: what's in inventory first, then the usual colors.
  const miniColorOptions = [
    ...(inventory || []).filter(i => i.kind === 'mini' && i.name.trim()).map(i => i.name.trim()),
    ...MINI_LIGHT_COLORS,
  ].filter((c, i, all) => all.findIndex(o => sameName(o, c)) === i);
  const [revenue, setRevenue] = useState(job.revenue != null ? String(job.revenue) : '');
  const [status, setStatus] = useState(job.status || 'Scheduled');
  const [miscCost, setMiscCost] = useState(job.miscCost != null ? String(job.miscCost) : '');
  const [miscNote, setMiscNote] = useState(job.miscNote || '');
  const [date] = useState(job.date || new Date().toISOString());
  const [scheduledDate, setScheduledDate] = useState(job.scheduledDate || (job.date ? job.date.slice(0, 10) : todayYMD()));
  // Older jobs can be marked paid with no method recorded; keep them paid rather than reset.
  const [deposit, setDeposit] = useState({ paid: !!job.depositPaid, method: job.depositMethod || '' });
  const [balance, setBalance] = useState({ paid: !!job.balancePaid, method: job.balanceMethod || '' });
  const payFields = {
    ...paymentFields(job, 'deposit', deposit.paid, deposit.method, settings),
    ...paymentFields(job, 'balance', balance.paid, balance.method, settings),
  };
  // Each assigned tech has their own commission % (`pct`, unrounded). `text` holds what was
  // typed while editing; a % that wasn't typed keeps full precision instead of the rounded
  // number shown, so an exact third stays exact when the job is saved again.
  const defaultPct = Number(settings.commissionPct) || 0;
  const evenSplit = (list, total) => list.map(a => ({ techId: a.techId, pct: total / list.length }));
  const isEvenDefault = (list) => list.every(a => Math.abs(a.pct - defaultPct / list.length) < 0.001);
  const [assignments, setAssignments] = useState(() =>
    computeJobFinancials(job, settings).shares.map(s => ({ techId: s.techId, pct: s.pct })));
  // Until a tech's % is changed by hand, adding or removing techs re-splits the default evenly.
  const [custom, setCustom] = useState(() => assignments.length > 0 && !isEvenDefault(assignments));
  const pctText = (a) => a.text !== undefined ? a.text : String(pct2(a.pct));

  // Removed techs only appear on jobs they were already on, so past jobs still show them.
  const pickableTechs = techs.filter(t => !t.removed || (job.assignments || []).some(a => a.techId === t.id));

  const toggleTech = (tech, checked) => {
    setAssignments(prev => {
      const next = checked ? [...prev, { techId: tech.id, pct: 0 }] : prev.filter(a => a.techId !== tech.id);
      return custom || next.length === 0 ? next : evenSplit(next, defaultPct);
    });
  };
  const setTechPct = (techId, value) => {
    setCustom(true);
    setAssignments(prev => prev.map(a => a.techId === techId ? { ...a, text: value, pct: Number(value) || 0 } : a));
  };
  const splitEvenly = () => {
    const total = assignments.reduce((s, a) => s + a.pct, 0) || defaultPct;
    setAssignments(evenSplit(assignments, total));
    setCustom(Math.abs(total - defaultPct) >= 0.001);
  };

  // Mini lights: one row per color, with estimated and actual balls (kept as text while editing).
  const [miniLights, setMiniLights] = useState(() => (job.miniLights || []).map(r => ({
    id: r.id || uid(), color: r.color || '',
    est: blankNum(r.est) ? '' : String(r.est), actual: blankNum(r.actual) ? '' : String(r.actual),
  })));
  const addMiniRow = () => setMiniLights(rows => [...rows, { id: uid(), color: '', est: '', actual: '' }]);
  const updateMini = (id, patch) => setMiniLights(rows => rows.map(r => r.id === id ? { ...r, ...patch } : r));
  const removeMini = (id) => setMiniLights(rows => rows.filter(r => r.id !== id));

  // Mock-up pictures. Each tile is { key, id, url, state }: state is 'loading', 'ready',
  // 'missing' (saved, but not on this device yet) or 'new' (chosen now, stored on Save).
  // Adding or removing pictures only takes effect when the job is saved.
  const [pics, setPics] = useState(() => mockupIdsOf(job).map(id => ({ key: id, id, url: null, state: 'loading' })));
  const [removedIds, setRemovedIds] = useState([]);
  const [picMsg, setPicMsg] = useState('');
  const [dragOver, setDragOver] = useState(false);
  const [viewing, setViewing] = useState(null); // key of the picture shown full size
  useEffect(() => {
    let alive = true;
    mockupIdsOf(job).forEach(id => {
      loadMockup(id)
        .then(url => alive && setPics(ps => ps.map(p => p.id === id ? { ...p, url, state: url ? 'ready' : 'missing' } : p)))
        .catch(() => alive && setPics(ps => ps.map(p => p.id === id ? { ...p, state: 'missing' } : p)));
    });
    return () => { alive = false; };
  }, []);
  const addFiles = async (fileList) => {
    const all = [...(fileList || [])];
    const files = all.filter(f => f.type.startsWith('image/'));
    if (!files.length) { if (all.length) setPicMsg('Those files aren’t pictures.'); return; }
    setPicMsg(`Preparing ${files.length} picture${files.length === 1 ? '' : 's'}…`);
    let failed = 0;
    for (const f of files) {
      try {
        const url = await compressImage(f);
        setPics(ps => [...ps, { key: uid(), id: null, url, state: 'new' }]);
      } catch (e) { failed++; }
    }
    setPicMsg(failed ? `${failed} picture${failed === 1 ? '' : 's'} couldn’t be read. Try JPG or PNG.` : '');
  };
  const removePic = (key) => {
    const p = pics.find(x => x.key === key);
    if (p && p.id) setRemovedIds(r => [...r, p.id]);
    setPics(ps => ps.filter(x => x.key !== key));
  };
  const viewable = pics.filter(p => p.url);
  const viewIndex = viewable.findIndex(p => p.key === viewing);
  const stepView = (dir) => setViewing(viewable[(viewIndex + dir + viewable.length) % viewable.length].key);

  const previewJob = {
    feet: Number(feet) || 0,
    revenue: Number(revenue) || 0,
    miscCost: Number(miscCost) || 0,
    assignments: assignments.map(a => ({ techId: a.techId, pct: a.pct })),
    miniLights,
    ...payFields,
  };
  const calc = computeJobFinancials(previewJob, settings);
  const pay = jobPayments(previewJob);

  const save = async () => {
    if (!customer.trim()) { alert('Enter a customer name.'); return; }
    if (feet === '' || isNaN(Number(feet)) || Number(feet) < 0) { alert('Enter valid feet installed.'); return; }
    for (const r of miniLights) {
      for (const [key, what] of [['est', 'estimated'], ['actual', 'actual']]) {
        if (!blankNum(r[key]) && (isNaN(Number(r[key])) || Number(r[key]) < 0)) {
          alert(`Enter a valid ${what} number of mini light balls${r.color ? ' for ' + r.color : ''}.`); return;
        }
      }
    }
    if (revenue === '' || isNaN(Number(revenue)) || Number(revenue) < 0) { alert('Enter a valid revenue amount.'); return; }
    for (const a of assignments) {
      const typed = a.text !== undefined ? a.text : String(a.pct);
      const p = Number(typed);
      if (typed === '' || isNaN(p) || p < 0 || p > 100) {
        const name = (techs.find(t => t.id === a.techId) || {}).name || 'a tech';
        alert(`Enter a commission between 0 and 100% for ${name}.`); return;
      }
    }
    if (calc.commissionPct > 100) { alert('Total commission can’t be more than 100% of the job.'); return; }

    const jobId = job.id || uid();
    // Keep the pictures in the order shown. Ones not on this device yet are kept, not dropped.
    const mockupIds = [];
    let storeFailed = 0;
    for (const p of pics) {
      if (p.state !== 'new') { mockupIds.push(p.id); continue; }
      const newId = uid();
      try {
        await imgPut(newId, { dataUrl: p.url, jobId, uploaded: false });
        mockupIds.push(newId);
      } catch (e) { storeFailed++; }
    }
    if (storeFailed) alert(`Couldn’t store ${storeFailed} new picture${storeFailed === 1 ? '' : 's'} on this device, so the job will be saved without ${storeFailed === 1 ? 'it' : 'them'}.`);

    onSave({
      id: jobId,
      customer: customer.trim(),
      miniLights: miniLights
        .filter(r => r.color.trim() || !blankNum(r.est) || !blankNum(r.actual))
        .map(r => ({
          id: r.id, color: r.color.trim(),
          est: blankNum(r.est) ? null : Number(r.est),
          actual: blankNum(r.actual) ? null : Number(r.actual),
        })),
      ...(mockupIds.length ? { mockupIds } : {}),
      feet: Number(feet),
      ...(rooflineColor ? { rooflineColor } : {}),
      revenue: Number(revenue),
      status,
      scheduledDate,
      ...payFields,
      miscCost: Number(miscCost) || 0,
      miscNote: miscNote.trim(),
      date,
      assignments: previewJob.assignments,
    });
    removedIds.forEach(deleteMockup);
    pushPendingMockups();
  };

  return (
    <Sheet title={isNew ? 'New Job' : 'Edit Job'} onClose={onClose}
      footer={(close) => (
        <React.Fragment>
          <button className="btn btn-ghost" onClick={close}>Cancel</button>
          <button className="btn btn-primary" onClick={save}>Save Job</button>
        </React.Fragment>
      )}>
        <div className="form-section">
        <label>Customer Name</label>
        <input type="text" value={customer} onChange={e => setCustomer(e.target.value)} placeholder="e.g. Smith Residence" autoFocus={isNew} />

        <label>Scheduled For</label>
        <input type="date" value={scheduledDate} onChange={e => setScheduledDate(e.target.value)} />

        <div className="field-group">
          <div>
            <label>Feet Installed</label>
            <input type="number" inputMode="decimal" min="0" step="1" value={feet} onChange={e => setFeet(e.target.value)} placeholder="0" />
          </div>
          <div>
            <label>Job Revenue ($)</label>
            <input type="number" inputMode="decimal" min="0" step="1" value={revenue} onChange={e => setRevenue(e.target.value)} placeholder="0" />
          </div>
        </div>
        </div>

        <div className="form-section">
        <label>Roofline Color</label>
        <div className="color-grid">
          {Object.keys(ROOFLINE_PATTERNS).map(name => (
            <div key={name} className={'pill color-pill' + (rooflineColor === name ? ' active' : '')}
              onClick={() => setRooflineColor(rooflineColor === name ? '' : name)}>
              <div>{name}</div>
              <div className="color-sub">{ROOFLINE_PATTERN_HINTS[name]}</div>
            </div>
          ))}
        </div>
        {Number(feet) > 0 && (() => {
          const sockets = socketsFor(Number(feet), settings);
          const intro = `${Number(feet).toLocaleString()} ft of ${spacingOf(settings)}″ line = ${sockets.toLocaleString()} bulbs`;
          if (!ROOFLINE_PATTERNS[rooflineColor]) return <div className="hint">{intro}. Pick a color so the bulbs count against your inventory.</div>;
          const split = bulbsByColor(ROOFLINE_PATTERNS[rooflineColor], sockets);
          return (
            <div className="hint">
              {intro}{split.length > 1 ? ': ' : ' '}
              <b>{split.map(([color, count]) => `${count.toLocaleString()} ${color}`).join(' · ')}</b>
            </div>
          );
        })()}
        <div className="hint">⏲ Plus <b>1 timer</b>. Every job gets one, and it’s counted in Inventory.</div>
        </div>

        <div className="form-section">
        <label>Mini Lights</label>
        <div className="card" style={{ margin: 0, padding: 10 }}>
          {miniLights.length === 0 ? (
            <div className="hint" style={{ marginTop: 0 }}>No mini lights on this job yet.</div>
          ) : (
            <div className="mini-grid mini-head"><span>Color</span><span>Est. balls</span><span>Actual</span><span></span></div>
          )}
          {miniLights.map(r => (
            <div className="mini-grid" key={r.id}>
              <input type="text" list="mini-light-colors" value={r.color} placeholder="Color"
                onChange={e => updateMini(r.id, { color: e.target.value })} aria-label="Mini light color" />
              <input type="number" inputMode="numeric" min="0" step="1" value={r.est} placeholder="0"
                onChange={e => updateMini(r.id, { est: e.target.value })} aria-label="Estimated balls" />
              <input type="number" inputMode="numeric" min="0" step="1" value={r.actual} placeholder="—"
                onChange={e => updateMini(r.id, { actual: e.target.value })} aria-label="Actual balls used" />
              <button className="icon-btn danger" onClick={() => removeMini(r.id)} aria-label="Remove this color"><Icon name="close" /></button>
            </div>
          ))}
          <datalist id="mini-light-colors">{miniColorOptions.map(c => <option key={c} value={c} />)}</datalist>
          <button className="btn btn-ghost btn-sm" style={{ marginTop: 8 }} onClick={addMiniRow}>+ Add color</button>
        </div>
        {miniLights.length > 0 && (
          <div className="hint">
            Estimated: <b>{calc.mini.est} balls</b> ({fmtMoney2(calc.mini.est * calc.mini.pricePerBall)})
            {calc.mini.actual > 0 && <React.Fragment> · Used: <b>{calc.mini.actual} balls</b> ({fmtMoney2(calc.mini.actual * calc.mini.pricePerBall)})</React.Fragment>}
            {' '}at {fmtMoney2(calc.mini.pricePerBall)} a ball. Each color’s actual count is what’s charged once you enter it; until then its estimate is used.
          </div>
        )}
        {status === 'Completed' && calc.mini.usingEstimate && (
          <div className="hint" style={{ color: 'var(--loss)' }}>⚠ This job is completed — enter the actual mini lights used.</div>
        )}
        </div>

        <div className="form-section">
        <label>Mock-up Pictures{pics.length > 0 ? ` (${pics.length})` : ''}</label>
        {pics.length > 0 && (
          <div className="pic-grid">
            {pics.map((p, i) => (
              <div className="pic-tile" key={p.key}>
                {p.url
                  ? <img src={p.url} alt={`Mock-up ${i + 1}`} onClick={() => setViewing(p.key)} />
                  : <div className="pic-placeholder">{p.state === 'loading' ? 'Loading…' : 'Not on this device yet'}</div>}
                <button className="pic-remove" onClick={() => removePic(p.key)} aria-label={`Remove picture ${i + 1}`}>✕</button>
              </div>
            ))}
          </div>
        )}
        <label className={'drop-zone' + (dragOver ? ' over' : '') + (pics.length ? ' compact' : '')}
          onDragOver={e => { e.preventDefault(); setDragOver(true); }}
          onDragLeave={() => setDragOver(false)}
          onDrop={e => { e.preventDefault(); setDragOver(false); addFiles(e.dataTransfer.files); }}>
          {pics.length === 0 && <div style={{ fontSize: 26 }}>🖼️</div>}
          <div>{pics.length === 0
            ? <React.Fragment><b>Drop mock-up pictures here</b> or tap to choose — you can add several</React.Fragment>
            : <React.Fragment><b>+ Add more pictures</b> (drop or tap)</React.Fragment>}</div>
          <input type="file" accept="image/*" multiple style={{ display: 'none' }}
            onChange={e => { addFiles(e.target.files); e.target.value = ''; }} />
        </label>
        {picMsg && <div className="hint">{picMsg}</div>}
        {pics.some(p => p.state === 'missing') && (
          <div className="hint">Some pictures aren’t on this device yet. They appear once the device that added them is online and signed in to Google sync.</div>
        )}
        {viewIndex >= 0 && (
          <div className="lightbox" onClick={() => setViewing(null)}>
            <img src={viewable[viewIndex].url} alt={`Mock-up ${viewIndex + 1}, full size`} />
            {viewable.length > 1 && (
              <React.Fragment>
                <button className="lightbox-nav prev" onClick={e => { e.stopPropagation(); stepView(-1); }} aria-label="Previous picture">‹</button>
                <button className="lightbox-nav next" onClick={e => { e.stopPropagation(); stepView(1); }} aria-label="Next picture">›</button>
              </React.Fragment>
            )}
            <div className="lightbox-close">{viewable.length > 1 ? `${viewIndex + 1} of ${viewable.length} · ` : ''}Tap anywhere to close</div>
          </div>
        )}
        </div>

        <div className="form-section">
        <label>Status</label>
        <div className="pill-group">
          <div className={"pill" + (status === 'Scheduled' ? ' active' : '')} onClick={() => setStatus('Scheduled')}>Scheduled</div>
          <div className={"pill gold" + (status === 'Completed' ? ' active' : '')} onClick={() => setStatus('Completed')}>Completed</div>
        </div>

        <label style={{ marginTop: 16 }}>Payment</label>
        {[['deposit', 'Deposit 50%', pay.deposit, deposit, setDeposit], ['balance', 'Balance', pay.balance, balance, setBalance]].map(([which, name, amount, st, setSt]) => {
          const fee = cardFeeFor(previewJob, which, amount, settings);
          return (
            <div className="pay-line" key={which}>
              <div className="row">
                <span style={{ fontWeight: 700, fontSize: 14 }}>{name}</span>
                <span style={{ fontWeight: 800 }}>{fmtMoney2(amount)}</span>
              </div>
              <PaymentPicker paid={st.paid} method={st.method} onPick={(paid, method) => setSt({ paid, method })} />
              {st.paid && !st.method && <div className="hint">Marked paid, but how wasn't recorded — tap a method to add it.</div>}
              {fee > 0 && <div className="hint" style={{ color: 'var(--loss)' }}>Card fee ({feePctFor(previewJob, which, settings)}%): −{fmtMoney2(fee)}</div>}
            </div>
          );
        })}
        </div>

        <div className="form-section">
        <label>Techs Assigned</label>
        <div className="card" style={{ margin: 0, padding: 10 }}>
          {pickableTechs.length === 0 ? (
            <div className="hint">No techs in your roster yet. Add techs from the Techs tab first.</div>
          ) : pickableTechs.map(t => {
            const a = assignments.find(x => x.techId === t.id);
            return (
              <React.Fragment key={t.id}>
                <div className="checkbox-row">
                  <input type="checkbox" checked={!!a} onChange={e => toggleTech(t, e.target.checked)} />
                  <div className="nm">{t.name}</div>
                  {a && (
                    <div className="tech-pct">
                      <input className="pct-input" type="number" inputMode="decimal" min="0" max="100" step="0.5"
                        value={pctText(a)} onChange={e => setTechPct(t.id, e.target.value)} aria-label={`${t.name} commission %`} />
                      <span className="tech-meta">%</span>
                      <span className="tech-amt">{fmtMoney2(calc.payByTech[t.id] || 0)}</span>
                    </div>
                  )}
                </div>
              </React.Fragment>
            );
          })}
        </div>
        <div className="hint" style={{ marginTop: 6 }}>
          {calc.techCount === 0
            ? `No techs assigned yet, so no commission is counted. Techs you add start with your ${defaultPct}% default, split evenly; then change anyone's %.`
            : <React.Fragment>
                Commission: <b>{pct2(calc.commissionPct)}%</b> of {fmtMoney2(previewJob.revenue)} = <b>{fmtMoney2(calc.commissionPool)}</b>.
                {' '}Each tech's % is of the whole job's revenue.
              </React.Fragment>}
        </div>
        {calc.techCount > 1 && (
          <button className="btn btn-ghost btn-sm" style={{ marginTop: 8 }} onClick={splitEvenly}>
            Split {pct2(calc.commissionPct || defaultPct)}% evenly
          </button>
        )}
        </div>

        <div className="form-section">
        <label>Misc / Materials Cost ($)</label>
        <input type="number" inputMode="decimal" min="0" step="0.01" value={miscCost} onChange={e => setMiscCost(e.target.value)} placeholder="0.00" />
        <label>Note (optional)</label>
        <input type="text" value={miscNote} onChange={e => setMiscNote(e.target.value)} placeholder="clips, timers, extension cords, gas..." />
        </div>

        <div className="summary-box">
          <div className="row"><span className="lab">Commission ({pct2(calc.commissionPct)}%{calc.techCount ? `, ${calc.techCount} ${calc.techCount === 1 ? 'tech' : 'techs'}` : ', no techs'})</span><span>{fmtMoney2(calc.commissionPool)}</span></div>
          <div className="row"><span className="lab">Card fees</span><span>{fmtMoney2(calc.cardFees)}</span></div>
          <div className="row"><span className="lab">Misc / materials</span><span>{fmtMoney2(previewJob.miscCost)}</span></div>
          <div className="row"><span className="lab">Lights ({calc.feet.toLocaleString()} ft × ${calc.lightCostPerFt.toFixed(2)})</span><span>{fmtMoney2(calc.lightCost)}</span></div>
          <div className="row"><span className="lab">Mini lights ({calc.mini.charged} balls × {fmtMoney2(calc.mini.pricePerBall)}{calc.mini.usingEstimate ? ', est.' : ''})</span><span>{fmtMoney2(calc.mini.cost)}</span></div>
          <div className="row total"><span className="lab">Total cost</span><span>{fmtMoney2(calc.costWithLights)}</span></div>
          <div className="row total"><span className="lab">Net profit</span><span>{fmtMoney2(calc.profitWithLights)}</span></div>
          <div className="row"><span className="lab">Margin</span><span>{fmtPct(calc.marginWithLights)}</span></div>
        </div>
        <div className="hint" style={{ marginTop: 6 }}>
          Lights are only subtracted here and on the Jobs tab. The Dashboard leaves them out because they're logged as an expense, so it will count this job's profit as {fmtMoney2(calc.netProfit)}.
        </div>
    </Sheet>
  );
}

// ================= Expenses =================
function ExpensesTab({ expenses, onAdd, onEdit, onDelete }) {
  const sorted = useMemo(() => [...expenses].sort((a, b) => (b.date || '').localeCompare(a.date || '')), [expenses]);
  const total = useMemo(() => expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0), [expenses]);

  return (
    <div>
      <div className="row" style={{ marginBottom: 10 }}>
        <div className="section-title" style={{ marginBottom: 0 }}>Business Expenses ({expenses.length})</div>
        <div style={{ fontWeight: 800, color: 'var(--loss)' }}>{fmtMoney(total)}</div>
      </div>

      {expenses.length === 0 ? (
        <div className="card"><div className="empty-state">
          <div className="big">💸</div>
          No expenses logged yet. Track overhead like insurance, fuel, and advertising here so your dashboard reflects true profit.
        </div></div>
      ) : <div className="expense-list">{sorted.map(ex => (
        <div className="card job-card" key={ex.id} onClick={() => onEdit(ex)}>
          <div className="job-top">
            <div>
              <div className="job-customer">{ex.description || ex.category}</div>
              <div className="job-sub">{fmtDateOnly(ex.date)} · {ex.category}</div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <div style={{ fontWeight: 800, fontSize: 16, fontVariantNumeric: 'tabular-nums' }}>{fmtMoney2(ex.amount)}</div>
              <button className="icon-btn danger" onClick={(e) => { e.stopPropagation(); if (confirm(`Delete this expense?`)) onDelete(ex.id); }} aria-label="Delete expense"><Icon name="trash" /></button>
            </div>
          </div>
        </div>
      ))}</div>}
    </div>
  );
}

function ExpenseModal({ expense, onClose, onSave }) {
  const isNew = !expense.id;
  const [date, setDate] = useState(expense.date || todayYMD());
  const [category, setCategory] = useState(expense.category || EXPENSE_CATEGORIES[0]);
  const [description, setDescription] = useState(expense.description || '');
  const [amount, setAmount] = useState(expense.amount != null ? String(expense.amount) : '');

  const save = () => {
    if (!date) { alert('Pick a date.'); return; }
    if (amount === '' || isNaN(Number(amount)) || Number(amount) < 0) { alert('Enter a valid amount.'); return; }
    onSave({ id: expense.id || uid(), date, category, description: description.trim(), amount: Number(amount) });
  };

  return (
    <Sheet title={isNew ? 'Add Expense' : 'Edit Expense'} onClose={onClose}
      footer={(close) => (
        <React.Fragment>
          <button className="btn btn-ghost" onClick={close}>Cancel</button>
          <button className="btn btn-primary" onClick={save}>Save Expense</button>
        </React.Fragment>
      )}>
      <div className="form-section">
        <label>Amount ($)</label>
        <input type="number" inputMode="decimal" min="0" step="0.01" value={amount} onChange={e => setAmount(e.target.value)} placeholder="0.00" autoFocus={isNew} />

        <label>Category</label>
        <select value={category} onChange={e => setCategory(e.target.value)}>
          {EXPENSE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
        </select>

        <label>Description (optional)</label>
        <input type="text" value={description} onChange={e => setDescription(e.target.value)} placeholder="e.g. Truck insurance premium" />

        <label>Date</label>
        <input type="date" value={date} onChange={e => setDate(e.target.value)} />
      </div>
    </Sheet>
  );
}

// ================= Dashboard =================
function DashboardTab({ jobs, techs, expenses, settings }) {
  const [sortKey, setSortKey] = useState('profit');
  const [sortDir, setSortDir] = useState('desc');
  const barRef = useRef(null);
  const lineRef = useRef(null);
  const barChart = useRef(null);
  const lineChart = useRef(null);

  // Every figure below counts only completed jobs that are paid in full.
  const calcs = useMemo(
    () => jobs.filter(isRealized).map(j => ({ job: j, calc: computeJobFinancials(j, settings) })),
    [jobs, settings]
  );
  const pending = useMemo(() => {
    const notCounted = jobs.filter(j => !isRealized(j));
    return { count: notCounted.length, revenue: notCounted.reduce((s, j) => s + (Number(j.revenue) || 0), 0) };
  }, [jobs]);

  const totals = useMemo(() => {
    const revenue = calcs.reduce((s, c) => s + (Number(c.job.revenue) || 0), 0);
    const cost = calcs.reduce((s, c) => s + c.calc.totalCost, 0);
    const cardFees = calcs.reduce((s, c) => s + c.calc.cardFees, 0);
    const profit = revenue - cost;
    const margins = calcs.filter(c => c.job.revenue > 0).map(c => c.calc.margin);
    const avgMargin = margins.length ? margins.reduce((s, m) => s + m, 0) / margins.length : 0;
    const expensesTotal = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
    const trueProfit = profit - expensesTotal;
    return { revenue, cost, cardFees, profit, avgMargin, expensesTotal, trueProfit };
  }, [calcs, expenses]);

  const sortedJobs = useMemo(() => {
    const arr = [...calcs];
    const dir = sortDir === 'asc' ? 1 : -1;
    const val = (c) => ({
      customer: c.job.customer.toLowerCase(),
      revenue: Number(c.job.revenue) || 0,
      feet: Number(c.job.feet) || 0,
      cost: c.calc.totalCost,
      profit: c.calc.netProfit,
      margin: c.calc.margin,
    }[sortKey]);
    arr.sort((a, b) => {
      const va = val(a), vb = val(b);
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });
    return arr;
  }, [calcs, sortKey, sortDir]);

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('desc'); }
  };

  const perTech = useMemo(() => {
    return techs.map(t => {
      let revenue = 0, pay = 0, jobCount = 0;
      calcs.forEach(({ job, calc }) => {
        if (!(job.assignments || []).some(x => x.techId === t.id)) return;
        jobCount += 1;
        revenue += Number(job.revenue) || 0;
        pay += calc.payByTech[t.id] || 0;
      });
      return { tech: t, revenue, pay, jobCount };
    }).filter(pt => !pt.tech.removed || pt.jobCount > 0);
  }, [techs, calcs]);

  const themeVersion = useThemeVersion();
  useEffect(() => {
    if (!window.Chart) return;
    const chronological = [...calcs].sort((a, b) => new Date(a.job.date) - new Date(b.job.date));
    // Chart colors come from the theme, so the charts match light and dark mode.
    const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const alpha = (hex, a) => {
      const h = hex.replace('#', '');
      const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
      return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
    };
    const profit = css('--profit'), loss = css('--loss'), gold = css('--gold');
    Chart.defaults.color = css('--muted');
    Chart.defaults.borderColor = alpha(css('--border-strong'), .5);
    Chart.defaults.font.family = "'Plus Jakarta Sans', system-ui, sans-serif";
    Chart.defaults.font.weight = 600;
    const tooltip = { backgroundColor: '#13221a', padding: 10, cornerRadius: 10, titleFont: { weight: 700 }, bodyFont: { weight: 600 } };
    const money = { ticks: { callback: v => '$' + Number(v).toLocaleString() }, grid: { drawTicks: false }, border: { display: false } };

    if (barChart.current) barChart.current.destroy();
    if (barRef.current) {
      barChart.current = new Chart(barRef.current, {
        type: 'bar',
        data: {
          labels: chronological.map(c => c.job.customer || 'Job'),
          datasets: [{
            label: 'Profit',
            data: chronological.map(c => c.calc.netProfit),
            backgroundColor: chronological.map(c => c.calc.netProfit >= 0 ? profit : loss),
            borderRadius: 8,
            maxBarThickness: 44,
          }],
        },
        options: {
          plugins: { legend: { display: false }, tooltip },
          scales: { y: money, x: { grid: { display: false }, border: { display: false } } },
        },
      });
    }

    if (lineChart.current) lineChart.current.destroy();
    if (lineRef.current) {
      lineChart.current = new Chart(lineRef.current, {
        type: 'line',
        data: {
          labels: chronological.map(c => fmtDate(c.job.date)),
          datasets: [
            { label: 'Revenue', data: chronological.map(c => Number(c.job.revenue) || 0), borderColor: gold, backgroundColor: alpha(gold, .16), tension: .35, fill: true, pointRadius: 4, pointBackgroundColor: gold, borderWidth: 2.5 },
            { label: 'Cost', data: chronological.map(c => c.calc.totalCost), borderColor: loss, backgroundColor: alpha(loss, .12), tension: .35, fill: true, pointRadius: 4, pointBackgroundColor: loss, borderWidth: 2.5 },
          ],
        },
        options: {
          plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } }, tooltip },
          scales: { y: money, x: { grid: { display: false }, border: { display: false } } },
        },
      });
    }
    return () => { if (barChart.current) barChart.current.destroy(); if (lineChart.current) lineChart.current.destroy(); };
  }, [calcs, themeVersion]);

  const sortArrow = (key) => sortKey === key ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';

  return (
    <div>
      <div className="stat-grid" style={{ marginBottom: 14 }}>
        <div className="stat-card"><div className="lbl">Total Revenue</div><div className="val">{fmtMoney(totals.revenue)}</div></div>
        <div className="stat-card"><div className="lbl">Total Cost</div><div className="val">{fmtMoney(totals.cost)}</div></div>
        <div className="stat-card"><div className="lbl">Net Profit</div><div className="val" style={{ color: totals.profit >= 0 ? 'var(--profit)' : 'var(--loss)' }}>{fmtMoney(totals.profit)}</div></div>
        <div className="stat-card"><div className="lbl">Avg Margin</div><div className="val">{fmtPct(totals.avgMargin)}</div></div>
      </div>
      <div className="hint" style={{ marginTop: -6, marginBottom: 12 }}>
        Counts only jobs that are <b>completed and paid in full</b> ({calcs.length} {calcs.length === 1 ? 'job' : 'jobs'}).
        {' '}Job costs here leave out the lights (they're in Expenses), so job profit runs higher than on the Jobs tab.
        {pending.count > 0 && ` Not counted yet: ${pending.count} ${pending.count === 1 ? 'job' : 'jobs'} worth ${fmtMoney(pending.revenue)} (scheduled, or still owed money).`}
        {totals.cardFees > 0 && ` Costs include ${fmtMoney2(totals.cardFees)} in card fees.`}
      </div>

      <div className="summary-box" style={{ marginTop: 0, marginBottom: 14 }}>
        <div className="row"><span className="lab">Job profit (revenue − job costs)</span><span>{fmtMoney2(totals.profit)}</span></div>
        <div className="row"><span className="lab">Business expenses</span><span>−{fmtMoney2(totals.expensesTotal)}</span></div>
        <div className="row total"><span className="lab">True Net Profit</span><span className={totals.trueProfit >= 0 ? 'good-on-dark' : 'bad-on-dark'}>{fmtMoney2(totals.trueProfit)}</span></div>
      </div>

      {calcs.length === 0 ? (
        <div className="card"><div className="empty-state"><div className="big">📊</div>
          {jobs.length === 0
            ? 'Add some jobs to see your dashboard.'
            : 'No completed, fully paid jobs yet. Jobs show up here once they’re marked Completed and both the deposit and balance are recorded as paid.'}
        </div></div>
      ) : (
        <div className="dash-grid">
          <div className="card">
            <div className="section-title">Job Profitability</div>
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th className={sortKey === 'customer' ? 'sorted' : ''} onClick={() => toggleSort('customer')}>Customer{sortArrow('customer')}</th>
                    <th className={"num" + (sortKey === 'feet' ? ' sorted' : '')} onClick={() => toggleSort('feet')}>Feet{sortArrow('feet')}</th>
                    <th className={"num" + (sortKey === 'revenue' ? ' sorted' : '')} onClick={() => toggleSort('revenue')}>Rev{sortArrow('revenue')}</th>
                    <th className={"num" + (sortKey === 'profit' ? ' sorted' : '')} onClick={() => toggleSort('profit')}>Profit{sortArrow('profit')}</th>
                    <th className={"num" + (sortKey === 'margin' ? ' sorted' : '')} onClick={() => toggleSort('margin')}>Margin{sortArrow('margin')}</th>
                  </tr>
                </thead>
                <tbody>
                  {sortedJobs.map(({ job, calc }) => (
                    <tr key={job.id}>
                      <td>{job.customer}</td>
                      <td className="num">{Number(job.feet) || 0}</td>
                      <td className="num">{fmtMoney(job.revenue)}</td>
                      <td className="num" style={{ color: calc.netProfit >= 0 ? 'var(--profit)' : 'var(--loss)', fontWeight: 700 }}>{fmtMoney(calc.netProfit)}</td>
                      <td className="num">{fmtPct(calc.margin)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <div className="card">
            <div className="section-title">Per-Tech Breakdown</div>
            {perTech.length === 0 ? <div className="hint">No techs yet.</div> : (
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr><th>Tech</th><th className="num">Jobs</th><th className="num">Job Revenue</th><th className="num">Commission</th></tr>
                  </thead>
                  <tbody>
                    {perTech.map(pt => (
                      <tr key={pt.tech.id}>
                        <td>{pt.tech.name}</td>
                        <td className="num">{pt.jobCount}</td>
                        <td className="num">{fmtMoney(pt.revenue)}</td>
                        <td className="num" style={{ fontWeight: 700 }}>{fmtMoney(pt.pay)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          <div className="card">
            <div className="section-title">Profit per Job</div>
            <canvas ref={barRef} height="180"></canvas>
          </div>
          <div className="card">
            <div className="section-title">Revenue vs Cost Over Time</div>
            <canvas ref={lineRef} height="180"></canvas>
          </div>
        </div>
      )}
    </div>
  );
}

// ================= Settings =================
function SettingsTab({ settings, setSettings, techs, onAddTech, onEditTech, onDeleteTech, jobs, onEditJob, onDeleteJob, expenses, onEditExpense, onDeleteExpense, inventory, user, syncState, authError, signIn, signOut, onImport }) {
  const [themePref, setThemePref] = useState(getThemePref());
  const [commStr, setCommStr] = useState(String(settings.commissionPct));
  const [feeStr, setFeeStr] = useState(String(settings.cardFeePct));
  const saveCardFee = () => {
    const v = Number(feeStr);
    if (feeStr === '' || isNaN(v) || v < 0 || v > 100) { alert('Enter a card fee between 0 and 100%.'); setFeeStr(String(settings.cardFeePct)); return; }
    if (v !== Number(settings.cardFeePct)) toast('Card fee saved');
    setSettings(s => ({ ...s, cardFeePct: v }));
  };
  const [miniStr, setMiniStr] = useState(String(settings.miniLightCostPerBall));
  const saveMiniCost = () => {
    const v = Number(miniStr);
    if (miniStr === '' || isNaN(v) || v < 0) { alert('Enter a valid cost per ball of mini lights.'); setMiniStr(String(settings.miniLightCostPerBall)); return; }
    if (v !== Number(settings.miniLightCostPerBall)) toast('Mini light cost saved');
    setSettings(s => ({ ...s, miniLightCostPerBall: v }));
  };
  const [spacingStr, setSpacingStr] = useState(String(spacingOf(settings)));
  const saveSpacing = () => {
    const v = Number(spacingStr);
    if (spacingStr === '' || isNaN(v) || v <= 0) { alert('Enter the bulb spacing in inches (more than 0).'); setSpacingStr(String(spacingOf(settings))); return; }
    if (v !== Number(settings.bulbSpacingIn)) toast('Bulb spacing saved');
    setSettings(s => ({ ...s, bulbSpacingIn: v }));
  };
  const [lightStr, setLightStr] = useState(String(settings.lightCostPerFt));
  const saveLightCost = () => {
    const v = Number(lightStr);
    if (lightStr === '' || isNaN(v) || v < 0) { alert('Enter a valid light cost per foot.'); setLightStr(String(settings.lightCostPerFt)); return; }
    if (v !== Number(settings.lightCostPerFt)) toast('Light cost saved');
    setSettings(s => ({ ...s, lightCostPerFt: v }));
  };
  const backups = lsGet(BACKUP_KEY, []).slice().reverse();

  const saveCommission = () => {
    const v = Number(commStr);
    if (commStr === '' || isNaN(v) || v < 0 || v > 100) { alert('Enter a commission between 0 and 100%.'); setCommStr(String(settings.commissionPct)); return; }
    if (v !== Number(settings.commissionPct)) toast('Commission saved');
    setSettings(s => ({ ...s, commissionPct: v }));
  };

  const [importMsg, setImportMsg] = useState('');
  const exportBackup = () => {
    const payload = { app: 'xmasLightsTracker', exportedAt: new Date().toISOString(), techs, jobs, expenses, settings, inventory };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `christmas-lights-backup-${todayYMD()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const importBackup = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      let d;
      try { d = JSON.parse(ev.target.result); } catch (err) { setImportMsg('That file is not a valid backup.'); return; }
      if (!d || !Array.isArray(d.jobs) || !Array.isArray(d.techs)) { setImportMsg('That file does not look like a Christmas Lights backup.'); return; }
      const counts = `${d.techs.length} techs, ${d.jobs.length} jobs, ${(d.expenses || []).length} expenses${Array.isArray(d.inventory) ? `, ${d.inventory.length} inventory items` : ''}`;
      if (!confirm(`Import this backup (${counts})?\n\nIt REPLACES all current data here, and on your other devices once synced.`)) return;
      onImport(d);
      setImportMsg(`Imported ${counts}.`);
    };
    reader.readAsText(file);
  };

  return (
    <div className="settings-grid">
      <div className="card">
        <div className="section-title">Appearance</div>
        <div className="pill-group">
          {[['auto', 'Automatic'], ['light', 'Light'], ['dark', 'Dark']].map(([id, label]) => (
            <div key={id} className={'pill' + (themePref === id ? ' active' : '')} onClick={() => { applyTheme(id); setThemePref(id); }}>{label}</div>
          ))}
        </div>
        <div className="hint">Automatic follows your phone or computer’s light/dark setting. Saved on this device only.</div>
      </div>

      <div className="card">
        <div className="section-title">Google Sync</div>
        {user ? (
          <div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
              {user.photoURL && <img src={user.photoURL} alt="" style={{ width: 40, height: 40, borderRadius: '50%', border: '2px solid var(--gold)' }} />}
              <div>
                <div className="tech-name">{user.displayName}</div>
                <div className="tech-meta">{user.email}</div>
              </div>
            </div>
            <div className="hint" style={{ marginBottom: 10 }}>
              {syncState === 'error' ? '⚠️ Could not reach the cloud. Your data is safe on this device and will retry automatically.' : '✅ Your data syncs automatically across all devices signed in with this account.'}
            </div>
            <button className="btn btn-ghost btn-block" onClick={signOut}>Sign Out</button>
          </div>
        ) : IS_FILE ? (
          <div>
            <div className="hint" style={{ marginBottom: 10 }}>
              You opened the copy saved on this computer. Google sign-in only works from the web version:
            </div>
            <a className="btn btn-primary btn-block" href={LIVE_URL} style={{ textDecoration: 'none' }}>Open the web version</a>
            <div className="hint" style={{ marginTop: 10 }}>
              Data entered in this copy stays in this copy. To move it over, tap <b>Export backup</b> below, then <b>Import backup</b> on the web version.
            </div>
          </div>
        ) : (
          <div>
            <div className="hint" style={{ marginBottom: 10 }}>Sign in with Google to sync your data between your phone and computer automatically.</div>
            <button className="btn-google" style={{ width: '100%', justifyContent: 'center' }} onClick={signIn}>
              <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
              Sign in with Google
            </button>
          </div>
        )}
        {authError && <div className="msg-err">{authError}</div>}
      </div>

      <div className="card">
        <div className="section-title">Roofline Line</div>
        <label>Bulb Spacing on Your Line (inches)</label>
        <div className="field-group">
          <input type="number" inputMode="decimal" min="1" step="1" value={spacingStr}
            onChange={e => setSpacingStr(e.target.value)} onBlur={saveSpacing} />
          <button className="btn btn-primary" style={{ flex: '0 0 auto' }} onClick={saveSpacing}>Save</button>
        </div>
        <div className="hint">Used to work out how many bulbs each job needs from its feet: at {spacingOf(settings)}″, 100 ft of line takes {socketsFor(100, settings)} bulbs.</div>
      </div>

      <div className="card">
        <div className="section-title">Light Costs</div>
        <label>Cost of Lights per Foot ($/ft)</label>
        <div className="field-group">
          <input type="number" inputMode="decimal" min="0" step="0.01" value={lightStr}
            onChange={e => setLightStr(e.target.value)} onBlur={saveLightCost} />
          <button className="btn btn-primary" style={{ flex: '0 0 auto' }} onClick={saveLightCost}>Save</button>
        </div>
        <label>Cost per Ball of Mini Lights ($)</label>
        <div className="field-group">
          <input type="number" inputMode="decimal" min="0" step="0.01" value={miniStr}
            onChange={e => setMiniStr(e.target.value)} onBlur={saveMiniCost} />
          <button className="btn btn-primary" style={{ flex: '0 0 auto' }} onClick={saveMiniCost}>Save</button>
        </div>
        <div className="hint">Both are subtracted from each job on the Jobs tab (feet installed, and mini light balls used) so you can see that job's true profit. The Dashboard leaves them out, because the lights are already logged as an expense.</div>
      </div>

      <div className="card">
        <div className="section-title">Tech Commission</div>
        <label>Starting Commission per Job (% of job revenue)</label>
        <div className="field-group">
          <input type="number" inputMode="decimal" min="0" max="100" step="0.5" value={commStr}
            onChange={e => setCommStr(e.target.value)} onBlur={saveCommission} />
          <button className="btn btn-primary" style={{ flex: '0 0 auto' }} onClick={saveCommission}>Save</button>
        </div>
        <div className="hint">When you add techs to a job, this % of the job's revenue is split evenly between them as a starting point. Then set any tech's own % on that job. Each job keeps the %s it was saved with, so changing this only affects jobs you set up afterwards.</div>
      </div>

      <div className="card">
        <div className="section-title">Card Processing Fee</div>
        <label>Fee on Card Payments (%)</label>
        <div className="field-group">
          <input type="number" inputMode="decimal" min="0" max="100" step="0.1" value={feeStr}
            onChange={e => setFeeStr(e.target.value)} onBlur={saveCardFee} />
          <button className="btn btn-primary" style={{ flex: '0 0 auto' }} onClick={saveCardFee}>Save</button>
        </div>
        <div className="hint">Taken off any deposit or balance recorded as paid by Card, and counted as a job cost. Each card payment keeps the fee % it was recorded with, so changing this later only affects new card payments.</div>
      </div>

      <div className="card">
        <div className="row" style={{ marginBottom: techs.length ? 8 : 0 }}>
          <div className="section-title" style={{ marginBottom: 0 }}>Tech Roster</div>
          <button className="btn btn-primary btn-sm" onClick={onAddTech}>+ Add</button>
        </div>
        {techs.length === 0 ? <div className="hint">No techs yet.</div> : techs.map(t => (
          <div className="tech-row" key={t.id}>
            <div>
              <div className="tech-name">{t.name}</div>
              <div className="tech-meta">Paid by commission</div>
            </div>
            <div>
              <button className="icon-btn" onClick={() => onEditTech(t)} aria-label={`Edit ${t.name}`}><Icon name="edit" /></button>
              <button className="icon-btn danger" onClick={() => { if (confirm(`Remove ${t.name}? They'll come off jobs that aren't completed yet. Completed jobs keep them, so past payouts don't change.`)) onDeleteTech(t.id); }} aria-label={`Remove ${t.name}`}><Icon name="trash" /></button>
            </div>
          </div>
        ))}
      </div>

      <div className="card">
        <div className="section-title">All Jobs ({jobs.length})</div>
        {jobs.length === 0 ? <div className="hint">No jobs yet.</div> : jobs.map(j => (
          <div className="tech-row" key={j.id}>
            <div>
              <div className="tech-name">{j.customer}</div>
              <div className="tech-meta">{fmtDate(j.date)} · {j.status}</div>
            </div>
            <div>
              <button className="icon-btn" onClick={() => onEditJob(j)} aria-label={`Edit ${j.customer}`}><Icon name="edit" /></button>
              <button className="icon-btn danger" onClick={() => { if (confirm(`Delete job for ${j.customer}?`)) onDeleteJob(j.id); }} aria-label={`Delete ${j.customer}`}><Icon name="trash" /></button>
            </div>
          </div>
        ))}
      </div>

      <div className="card">
        <div className="section-title">All Expenses ({expenses.length})</div>
        {expenses.length === 0 ? <div className="hint">No expenses yet.</div> : expenses.map(ex => (
          <div className="tech-row" key={ex.id}>
            <div>
              <div className="tech-name">{ex.description || ex.category}</div>
              <div className="tech-meta">{fmtDateOnly(ex.date)} · {ex.category} · {fmtMoney2(ex.amount)}</div>
            </div>
            <div>
              <button className="icon-btn" onClick={() => onEditExpense(ex)} aria-label="Edit expense"><Icon name="edit" /></button>
              <button className="icon-btn danger" onClick={() => { if (confirm('Delete this expense?')) onDeleteExpense(ex.id); }} aria-label="Delete expense"><Icon name="trash" /></button>
            </div>
          </div>
        ))}
      </div>

      <div className="card">
        <div className="section-title">Backup File</div>
        <div className="hint" style={{ marginBottom: 10 }}>Save all your data to a file, or load it from one — for moving data between copies of the app or keeping your own backup. Mock-up pictures aren’t included in the file.</div>
        <div className="field-group">
          <button className="btn btn-primary" style={{ flex: 1 }} onClick={exportBackup}>Export backup</button>
          <label className="btn btn-ghost" style={{ flex: 1, margin: 0, color: 'var(--text)', fontSize: 14.5 }}>
            Import backup
            <input type="file" accept="application/json,.json" onChange={importBackup} style={{ display: 'none' }} />
          </label>
        </div>
        {importMsg && <div className="hint" style={{ marginTop: 8 }}>{importMsg}</div>}
      </div>

      <div className="card">
        <div className="section-title">Automatic Backups</div>
        <div className="hint" style={{ marginBottom: 6 }}>A snapshot of your data is saved on this device once a day (last 14 days).</div>
        {backups.length === 0 ? <div className="hint">No backups yet.</div> : backups.map(b => (
          <div className="tech-row" key={b.day}>
            <div>
              <div className="tech-name">{fmtDate(b.ts)}</div>
              <div className="tech-meta">{(b.data.techs || []).length} techs · {(b.data.jobs || []).length} jobs · {(b.data.expenses || []).length} expenses{Array.isArray(b.data.inventory) ? ` · ${b.data.inventory.length} inventory items` : ''}</div>
            </div>
            <button className="btn btn-ghost btn-sm" onClick={() => { if (confirm('Restore this backup? It REPLACES all current data on every synced device.')) onImport(b.data); }}>Restore</button>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
